<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thays Freitas Fisioterapia</title>
<meta name="theme-color" content="#1E9A78">
<meta name="description" content="Agenda, pacientes e financeiro do consultório Thays Freitas Fisioterapia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thays Fisio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Plano: consultório claro e acolhedor. Verde-esmeralda (cor associada à fisioterapia) como principal, menta clara de fundo,
   âmbar suave só para destaque. Cabeçalho branco com a logomarca Thays Freitas; agenda do dia como linha do tempo. Tema único claro. */
:root{
  --header:#FFFFFF; --header-ink:#173B35; --primary:#1E9A78; --primary-2:#16805F; --on-primary:#FFFFFF; --accent:#F2B84B; --accent-bg:#FFF4DC;
  --bg:#F3FAF8; --surface:#FFFFFF; --surface-2:#F7FCFB; --ink:#1D3B36; --muted:#5F7A75; --line:#DCEDE8; --chip:#E7F5F1; --mint:#D9F2EA;
  --ok:#1F8A52; --ok-bg:#E3F6EA; --warn:#9C6A0E; --warn-bg:#FFF2D9; --crit:#C24A3F; --crit-bg:#FDE9E6; --info:#2D72B8; --info-bg:#E6F0FB;
  --lilac:#7B5FC7; --lilac-bg:#EFEAFB;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:12px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
a{color:var(--info)}
[hidden]{display:none !important}
.ic{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em;display:inline-block}
.ic.lg{width:22px;height:22px}
.tabs a[aria-current="page"],.qa,.ti,.pill,.ri{--duo:.3}
.btn.primary{--duo:.35}
.ic.xl{width:40px;height:40px;stroke-width:1.6}

/* Cabeçalho */
.top{background:var(--header);color:var(--header-ink);border-bottom:1px solid var(--line);box-shadow:0 2px 14px rgba(30,154,120,.07)}
.top-in{max-width:1240px;margin:0 auto;padding:14px 20px 0;display:grid;grid-template-columns:1fr auto;gap:12px 16px;align-items:center}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:48px;height:48px;flex:none;display:block}
.wordmark{display:grid;line-height:1}
.wordmark b{font:700 23px/1 var(--f-display);letter-spacing:-.01em;color:var(--header-ink)}
.wordmark span{font:700 10.5px/1 var(--f-body);letter-spacing:.32em;text-transform:uppercase;color:var(--primary);margin-top:5px}
.brand h1{font-size:22px;font-weight:700;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.tabs{grid-column:1 / -1;display:flex;gap:2px;overflow-x:auto}
.tabs a{display:inline-flex;align-items:center;gap:7px;color:var(--muted);text-decoration:none;font:600 15px/1 var(--f-body);padding:12px 14px 12px;border-radius:10px 10px 0 0;white-space:nowrap}
.tabs a:hover{color:var(--primary);background:var(--surface-2)}
.tabs a[aria-current="page"]{color:var(--primary-2);background:var(--bg);box-shadow:inset 0 3px 0 var(--primary)}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:999px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.08)}
.top .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(30,154,120,.25)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.ok{color:var(--ok);border-color:var(--ok)}
.btn.sm{padding:5px 11px;font-size:13.5px;min-height:32px}
.btn.icon{padding:0;width:40px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--info);cursor:pointer;padding:0;font-weight:600;display:inline-flex;align-items:center;gap:5px}

main{max-width:1240px;margin:0 auto;padding:18px 20px 40px;display:grid;gap:16px}
main > *,#body > *{min-width:0}
#body{display:grid;gap:16px;min-width:0}
#banner{max-width:1240px;margin:0 auto;padding:0 20px}
#banner:empty{display:none}
.note{margin-top:14px;padding:10px 14px;border-radius:var(--r);display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line)}
.note > .ic{width:20px;height:20px}
.note.warn{background:var(--warn-bg);border-color:transparent} .note.warn > .ic{color:var(--warn)}
.note.info{background:var(--info-bg);border-color:transparent} .note.info > .ic{color:var(--info)}
.note .grow{flex:1;min-width:200px}

/* Indicadores */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile .ti{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--chip);color:var(--primary)}
.tile .k{font-size:13px;font-weight:600;color:var(--muted);padding-right:44px}
.tile .v{font:700 28px/1.15 var(--f-display);margin-top:6px}
.tile .s{font-size:13px;color:var(--muted)}
.tile.warn .ti{background:var(--warn-bg);color:var(--warn)} .tile.warn .v{color:var(--warn)}
.tile.crit .ti{background:var(--crit-bg);color:var(--crit)} .tile.crit .v{color:var(--crit)}
.tile.ok .ti{background:var(--ok-bg);color:var(--ok)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.panel h2{font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel h2 > .ic{color:var(--primary)}
.panel > h2{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.emptybox{display:grid;justify-items:center;gap:8px;text-align:center;color:var(--muted);padding:22px 10px}
.emptybox .ic{color:var(--line)}
.mini{display:inline-flex;align-items:center;gap:5px}
.mini .ic{width:14px;height:14px}
.muted{color:var(--muted)}
.pos{color:var(--ok);font-weight:600}
.neg{color:var(--crit);font-weight:600}

/* Pílulas */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--chip);color:var(--ink)}
.pill .ic{width:13px;height:13px;stroke-width:2.4}
.pill.agendado{background:var(--chip);color:var(--ink)}
.pill.confirmado{background:var(--info-bg);color:var(--info)}
.pill.realizado{background:var(--ok-bg);color:var(--ok)}
.pill.falta{background:var(--crit-bg);color:var(--crit)}
.pill.cancelado{background:var(--chip);color:var(--muted)}
.pill.remarcado{background:var(--warn-bg);color:var(--warn)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}

/* Agenda */
.agbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg2{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
.seg2 button{border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;display:inline-flex;gap:6px;align-items:center;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.agbar input[type=date]{padding:8px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.agbar .chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.agbar .grow{flex:1}
.navg{display:inline-flex;gap:6px}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dayhead h2{font-size:24px;font-weight:700}
.dayhead h2::first-letter{text-transform:uppercase}
.timeline{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.slot{display:grid;grid-template-columns:74px 1fr;border-bottom:1px solid var(--line);min-height:58px}
.slot:last-child{border-bottom:0}
.slot .hr{font:600 20px/1 var(--f-display);color:var(--muted);padding:14px 0 0 16px;letter-spacing:-.02em}
.slot.now .hr{color:var(--primary)}
.slot.now{background:linear-gradient(90deg,var(--mint),transparent 40%)}
.slot .cards{display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px 8px 0;align-items:flex-start}
.free{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:9px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px;width:100%}
.free:hover{border-color:var(--primary);color:var(--primary)}
.ses{display:grid;gap:3px;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 12px 9px 14px;cursor:pointer;min-width:220px;flex:1 1 240px;box-shadow:inset 4px 0 0 var(--stripe,var(--line))}
.ses:hover{border-color:var(--muted)}
.ses .sh{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.ses .sh b{font:700 16px/1 var(--f-display);color:var(--ink)}
.ses .sn{font-weight:700;font-size:15.5px}
.ses .sm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.ses.st-confirmado{--stripe:var(--info)}
.ses.st-realizado{--stripe:var(--ok)}
.ses.st-falta{--stripe:var(--crit)}
.ses.st-agendado{--stripe:var(--muted)}
.ses.st-cancelado,.ses.st-remarcado{opacity:.6;--stripe:var(--line)}
.ses.st-cancelado .sn{text-decoration:line-through}
.ses.compact{min-width:0;flex:none;width:100%;padding:6px 8px 7px 11px}
.ses.compact .sn{font-size:14px}
.week{display:grid;grid-template-columns:repeat(var(--cols,6),minmax(0,1fr));gap:10px}
@media (max-width:900px){.week{grid-template-columns:1fr}}
.wcol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:7px;align-content:start;min-width:0}
.wcol.today{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.wh{display:flex;justify-content:space-between;align-items:center;border:0;background:none;cursor:pointer;padding:2px 2px 6px;font-weight:700;border-bottom:1px solid var(--line);text-align:left}
.wh span{font-family:var(--f-display);font-size:16px}
.wh small{color:var(--muted);font-weight:600}

/* Pacientes */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .grow{flex:1}
.toolbar select,.toolbar input[type=month]{padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.search{position:relative;flex:1 1 260px;display:flex;color:var(--muted)}
.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%)}
.search input{width:100%;min-width:200px;padding:9px 12px 9px 38px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.count{font-size:13px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;cursor:pointer;text-align:left}
.pcard:hover{border-color:var(--muted)}
.pcard.off{opacity:.6}
.pcard .ph{display:flex;align-items:center;gap:10px}
.av{width:40px;height:40px;border-radius:50%;background:var(--chip);color:var(--primary);display:grid;place-items:center;font:700 15px/1 var(--f-display);flex:none}
.pcard .pn{font-weight:700;font-size:16px;line-height:1.2}
.pcard .pl{display:grid;gap:4px;font-size:13.5px;color:var(--muted)}
.pcard .pf{display:flex;flex-wrap:wrap;gap:6px}
.wa{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-weight:600;text-decoration:none}

/* Tabelas */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{font-size:12.5px;font-weight:600;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.t th .ic{width:13px;height:13px;margin-right:4px;vertical-align:-.15em}
.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t .r{text-align:right}
.t .acts{white-space:nowrap;text-align:right}
.t .acts > * + *{margin-left:4px}
.rows{display:grid;gap:6px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;background:var(--surface-2);box-shadow:inset 3px 0 0 var(--stripe,transparent)}
.row.crit{--stripe:var(--crit)} .row.warn{--stripe:var(--warn)} .row.ok{--stripe:var(--ok)}
.row .ri{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--primary)}
.row.crit .ri{background:var(--crit-bg);color:var(--crit)} .row.warn .ri{background:var(--warn-bg);color:var(--warn)}
.row .rt{min-width:0}
.row .rt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.row .rt span{font-size:13px;color:var(--muted)}
.row .rv{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:14px}
.bar .track{grid-column:1 / -1;height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--primary);border-radius:4px}

/* Modal */
.backdrop{position:fixed;inset:0;background:rgba(23,59,53,.35);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:32px 12px;overflow-y:auto;z-index:20}
.modal{background:var(--surface);color:var(--ink);border-radius:16px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{max-width:960px}
.modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 8px}
.modal-h h2{font-size:22px;display:flex;align-items:center;gap:10px}
.hb{width:38px;height:38px;border-radius:12px;background:var(--chip);color:var(--primary);display:grid;place-items:center;flex:none}
.hb .ic{width:20px;height:20px}
.modal-b{padding:6px 20px 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.modal-b .grid2 > *,.modal-b .sec{min-width:0}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 16px 16px;flex-wrap:wrap}
.x{background:none;border:0;cursor:pointer;color:var(--muted);padding:4px;border-radius:8px}
.x:hover{background:var(--chip)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
@media (max-width:560px){.fields{grid-template-columns:1fr}}
.field{display:grid;gap:5px;min-width:0}
.field.full{grid-column:1 / -1}
.field > span{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:5px}
.field > span .ic{width:14px;height:14px}
.field input,.field select,.field textarea{padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%}
.field textarea{min-height:64px;resize:vertical}
.field small{color:var(--muted);font-size:12.5px}
.req::after{content:"*";color:var(--crit);margin-left:2px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.opt span{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-weight:600;font-size:14px}
.opt input:checked + span{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.opt input:focus-visible + span{outline:2px solid var(--primary);outline-offset:2px}
.hint{padding:10px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-size:14px;display:flex;gap:8px;align-items:flex-start}
.hint .ic{margin-top:2px}
.hint.warn{background:var(--warn-bg);border-color:transparent}
.hint.crit{background:var(--crit-bg);border-color:transparent}
.formerr{color:var(--crit);font-weight:600}
.ftabs{margin-bottom:14px}
.fsub{grid-column:1 / -1;margin:6px 0 0;font:700 14px/1.2 var(--f-body);color:var(--primary-2);display:flex;align-items:center;gap:6px}
.aval{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}
@media (max-width:560px){.aval{grid-template-columns:1fr}}
.aval > div{min-width:0}.aval .full{grid-column:1 / -1}
.aval b{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.aval p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.vit{display:flex;flex-wrap:wrap;gap:6px}
.evol{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 0}
.formerr:empty{display:none}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta .ic{color:var(--primary)}
.meta b{color:var(--ink);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpis > div{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpis .k{font-size:12.5px;font-weight:600;color:var(--muted);display:flex;gap:5px;align-items:center}
.kpis .k .ic{width:13px;height:13px}
.kpis .v{font:700 21px/1.2 var(--f-display);margin-top:3px}
.sec h3{font-size:16px;display:flex;align-items:center;gap:7px;margin-bottom:8px}
.sec h3 .ic{color:var(--primary)}
.chk{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--primary)}

#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:40;width:min(92vw,460px)}
.toast{background:#173B35;color:#fff;padding:11px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center}
.toast .ic{color:#7FD6A3} .toast.err .ic{color:#F08177}
.skel{color:var(--muted);padding:30px 0;text-align:center}
@media (max-width:640px){
  .top-in{padding:12px 14px 0}
  main{padding:14px 14px 40px}
  #banner{padding:0 14px}
  .brand p{display:none}
  .brand h1{font-size:19px}
  .top .btn .lbl{display:none}
  .slot{grid-template-columns:58px 1fr}
  .slot .hr{font-size:17px;padding-left:12px}
  .ses{min-width:0}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile{padding:12px}
  .tile .v{font-size:21px}
  .tile .ti{width:30px;height:30px;top:10px;right:10px}
  .tile .ti .ic{width:17px;height:17px}
  .tile .k{padding-right:34px}
  .agbar input[type=date]{flex:1;min-width:0}
  .agbar .grow{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .modal{animation:pop .16s ease-out}
  @keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
}

/* Ações rápidas, legenda, cores suaves */
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.qa{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;text-align:left;font-size:15px}
.qa:hover{border-color:var(--primary);box-shadow:0 4px 14px rgba(30,154,120,.12)}
.qa small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:1px}
.qi{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;background:var(--mint);color:var(--primary-2)}
.qi .ic{width:21px;height:21px}
.qi.amber{background:var(--accent-bg);color:#A16A00}.qi.lilac{background:var(--lilac-bg);color:var(--lilac)}.qi.blue{background:var(--info-bg);color:var(--info)}
.tile .ti.amber{background:var(--accent-bg);color:#A16A00}.tile .ti.lilac{background:var(--lilac-bg);color:var(--lilac)}.tile .ti.blue{background:var(--info-bg);color:var(--info)}
.legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.ses{background:#FFFFFF}
.ses.st-confirmado{background:#F3F8FE}.ses.st-realizado{background:#F2FAF5}.ses.st-falta{background:#FDF4F2}
.free .ic.soft{color:var(--accent)}
.av{background:var(--avbg,var(--chip));color:var(--avfg,var(--primary))}
.wh .ic{width:14px;height:14px;color:var(--primary);margin-right:4px}
.logo-prev{background:linear-gradient(135deg,#FFFFFF,var(--mint));border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.logo-prev svg{max-width:100%;height:auto}
.oficial-box{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.oficial-box img{height:72px;width:auto;border-radius:8px;background:#fff;border:1px solid var(--line);padding:4px}
@media (max-width:640px){.wordmark b{font-size:19px}.logo{width:40px;height:40px}#brand-oficial{height:32px !important}.qa{padding:10px}.qa small{display:none}}
.wa-chip{border:0;cursor:pointer;background:#E3F6EA !important;color:#1F8A52 !important;font:inherit;font-size:12.5px;font-weight:700}
.wa-chip:hover{background:#CDEFD9 !important}
.wa-chip.sent{background:var(--chip) !important;color:var(--muted) !important}
.ses.compact .wa-chip{padding:3px 6px}

/* Tela de login */
#login{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#FFFFFF 0%,var(--mint) 100%);display:grid;place-items:center;padding:20px;overflow-y:auto}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 24px;box-shadow:0 20px 50px rgba(30,154,120,.15);display:grid;gap:4px;text-align:center}
.login-logo{width:84px;height:84px;margin:0 auto 6px}
.login-card h1{font-size:28px}
.login-sub{margin:0 0 16px;font:700 11px/1 var(--f-body);letter-spacing:.34em;color:var(--primary)}
#form-login{display:grid;gap:12px;text-align:left}
body.locked .top,body.locked main,body.locked #banner{display:none}
@supports(padding:max(0px)){.top-in{padding-top:max(14px,env(safe-area-inset-top))}}
</style>

<script>
(function(){
'use strict';
/* ================= Utilitários ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(n,c)=>'<svg class="ic'+(c?' '+c:'')+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>';
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dOf=iso=>{const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d);};
const addD=(iso,n)=>{const d=dOf(iso);d.setDate(d.getDate()+n);return isoOf(d);};
const today=()=>isoOf(new Date());
const wd=iso=>dOf(iso).getDay();
const monday=iso=>addD(iso,-((wd(iso)+6)%7));
const ym=iso=>iso.slice(0,7);
const dim=k=>new Date(+k.slice(0,4),+k.slice(5,7),0).getDate();
const DOW=['dom','seg','ter','qua','qui','sex','sáb'];
const DOWL=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const fmtD=iso=>iso?iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4):'—';
const fmtDS=iso=>DOW[wd(iso)]+', '+iso.slice(8,10)+'/'+iso.slice(5,7);
const fmtDL=iso=>DOWL[wd(iso)]+', '+(+iso.slice(8,10))+' de '+MES[+iso.slice(5,7)-1];
const fmtYM=k=>MES[+k.slice(5,7)-1]+'/'+k.slice(0,4);
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const money=v=>BRL.format(Number(v)||0);
const r2=n=>Math.round(n*100)/100;
const toMin=h=>{const[a,b]=String(h||'0:0').split(':').map(Number);return(a||0)*60+(b||0);};
const fromMin=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const initials=n=>String(n||'?').trim().split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
function* months(a,b){let y=+a.slice(0,4),m=+a.slice(5,7);const by=+b.slice(0,4),bm=+b.slice(5,7);let g=0;while((y<by||(y===by&&m<=bm))&&g++<240){yield y+'-'+pad(m);m++;if(m>12){m=1;y++;}}}
function idade(n){if(!n)return'';const t=new Date(),d=dOf(n);let a=t.getFullYear()-d.getFullYear();if(t.getMonth()<d.getMonth()||(t.getMonth()===d.getMonth()&&t.getDate()<d.getDate()))a--;return a>=0&&a<130?a+' anos':'';}
function phoneDigits(p){let d=String(p||'').replace(/\D/g,'');if(!d)return'';if(d.startsWith('0'))d=d.replace(/^0+/,'');if(d.length<=11)d='55'+d;return d;}
function waLink(p,msg){const d=phoneDigits(p);return d?'https://wa.me/'+d+(msg?'?text='+encodeURIComponent(msg):''):'';}
function extenso(v){
  const u=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const d=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const c=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const ate999=n=>{if(!n)return'';if(n===100)return'cem';const p=[];const h=Math.floor(n/100),r=n%100;if(h)p.push(c[h]);if(r){if(r<20)p.push(u[r]);else{const t=Math.floor(r/10),o=r%10;p.push(o?d[t]+' e '+u[o]:d[t]);}}return p.join(' e ');};
  const reais=Math.floor(v+1e-9),cent=Math.round((v-reais)*100);const parts=[];
  if(reais){const mil=Math.floor(reais/1000),r=reais%1000;let s='';if(mil)s=mil===1?'mil':ate999(mil)+' mil';if(r)s+=(mil?((r<100||r%100===0)?' e ':' '):'')+ate999(r);parts.push(s+(reais===1?' real':' reais'));}
  if(cent)parts.push(ate999(cent)+(cent===1?' centavo':' centavos'));
  return parts.join(' e ')||'zero real';
}

/* ================= Domínio ================= */
const ST={agendado:{l:'Agendado',i:'clock'},confirmado:{l:'Confirmado',i:'check'},realizado:{l:'Realizado',i:'okcircle'},falta:{l:'Falta',i:'userx'},cancelado:{l:'Cancelado',i:'xcircle'},remarcado:{l:'Remarcado',i:'rotate'}};
const COB={avulsa:{l:'Sessão avulsa',s:'Avulsa',i:'coins'},pacote:{l:'Pacote',s:'Pacote',i:'box'},mensalidade:{l:'Mensalidade',s:'Mensal',i:'repeat'},convenio:{l:'Convênio',s:'Convênio',i:'shield'}};
const FORMAS=['Pix','Dinheiro','Cartão de débito','Cartão de crédito','Transferência','Boleto'];
const FORMA_IC={'Pix':'zap','Dinheiro':'banknote','Cartão de débito':'card','Cartão de crédito':'card','Transferência':'bank','Boleto':'barcode'};
const fIc=f=>ic(FORMA_IC[f]||'wallet');
const AVC=[['#DDF4EC','#16805F'],['#FFF0D6','#9A6400'],['#ECE7FB','#6A4FC0'],['#E3EFFB','#2D6CB0'],['#FCE6E3','#B5463B'],['#E6F3F7','#25748A']];
const avStyle=n=>{let h=0;for(const ch of String(n||''))h=(h*31+ch.charCodeAt(0))>>>0;const c=AVC[h%AVC.length];return`style="--avbg:${c[0]};--avfg:${c[1]}"`;};
const DEFAULT_MSG='Olá, {nome}! Passando para confirmar sua sessão de fisioterapia {dia} às {hora}{local}. Posso confirmar?';
const ACTIVE=s=>s.status!=='cancelado'&&s.status!=='remarcado';
const stPill=st=>{const x=ST[st]||ST.agendado;return`<span class="pill ${esc(st)}">${ic(x.i)}${x.l}</span>`;};
const cobPill=c=>{const x=COB[c]||COB.avulsa;return`<span class="pill">${ic(x.i)}${x.s}</span>`;};
const emptyBox=(n,t)=>`<div class="emptybox">${ic(n,'xl')}<span>${t}</span></div>`;

const S={pac:new Map(),ses:[],pct:new Map(),pla:new Map(),rec:[],cfg:{},ready:{},live:{},timedOut:false,dbErr:null,noAccess:false,
  tab:'agenda',view:'dia',day:today(),showCanc:false,pq:'',pst:'ativos',fmes:ym(today()),open:null};
const COLLS={pacientes:'pac',sessoes:'ses',pacotes:'pct',planos:'pla',recebimentos:'rec'};
let db=null,U=null,DL=null,myId=null,writable=true,loadTimer=null,D=null;
const CFG=()=>Object.assign({nomeProfissional:'',crefito:'',documento:'',telefone:'',endereco:'',cidade:'',pix:'',valorPadrao:120,duracaoPadrao:50,inicioDia:'07:00',fimDia:'19:00',prazoPagamento:0,msgWhats:DEFAULT_MSG},S.cfg);
const pacList=()=>[...S.pac.entries()].map(([id,d])=>({id,...d})).sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR'));
const pacName=id=>(S.pac.get(id)||{}).nome||'Paciente removido';

function derive(){
  if(D)return D;
  const paid=new Map(),convPaid=new Set();
  for(const r of S.rec){
    if(r.referencia==='convenio'){(r.sessoes||[]).forEach(id=>convPaid.add(id));continue;}
    const k=r.referencia+':'+(r.refId||'')+':'+(r.competencia||'');paid.set(k,(paid.get(k)||0)+(+r.valor||0));
  }
  const uso=new Map();
  for(const s of S.ses){if(!s.pacoteId)continue;const p=S.pct.get(s.pacoteId);if(!p)continue;if(s.status==='realizado'||(s.status==='falta'&&p.faltaConsome))uso.set(s.pacoteId,(uso.get(s.pacoteId)||0)+1);}
  const t=today(),curM=ym(t);const prazo=Math.max(0,Math.round(+CFG().prazoPagamento||0));const pend=[],semPac=[],conv=[];
  for(const s of S.ses){
    if(s.cobranca==='avulsa'&&s.status==='realizado'&&+s.valor>0){const pg=paid.get('sessao:'+s.id+':')||0;const ab=r2(+s.valor-pg);if(ab>0.004){const venc=addD(s.data,prazo);pend.push({key:'s:'+s.id,tipo:'sessao',pacienteId:s.pacienteId,venc,desc:'Sessão de '+fmtD(s.data),valor:+s.valor,pago:pg,aberto:ab,ref:'sessao',refId:s.id,comp:'',vencido:venc<t});}}
    if(s.cobranca==='pacote'&&!s.pacoteId&&s.status==='realizado')semPac.push(s);
    if(s.cobranca==='convenio'&&s.status==='realizado'&&!convPaid.has(s.id))conv.push(s);
  }
  for(const[id,p]of S.pct){const pg=paid.get('pacote:'+id+':')||0;const ab=r2(+p.valor-pg);if(ab>0.004)pend.push({key:'p:'+id,tipo:'pacote',pacienteId:p.pacienteId,venc:p.dataCompra||t,desc:'Pacote de '+p.qtd+' sessões',valor:+p.valor,pago:pg,aberto:ab,ref:'pacote',refId:id,comp:'',vencido:(p.dataCompra||t)<t});}
  for(const[id,pl]of S.pla){
    if(!pl.inicio)continue;const end=pl.ativo===false&&pl.fim?(pl.fim<curM?pl.fim:curM):curM;
    for(const k of months(pl.inicio,end)){const venc=k+'-'+pad(Math.min(+pl.dia||10,dim(k)));const pg=paid.get('mensalidade:'+id+':'+k)||0;const ab=r2(+pl.valor-pg);if(ab>0.004)pend.push({key:'m:'+id+':'+k,tipo:'mensalidade',pacienteId:pl.pacienteId,venc,desc:'Mensalidade '+fmtYM(k),valor:+pl.valor,pago:pg,aberto:ab,ref:'mensalidade',refId:id,comp:k,vencido:venc<t});}
  }
  pend.sort((a,b)=>a.venc<b.venc?-1:a.venc>b.venc?1:0);
  return D={paid,convPaid,uso,pend,semPac,conv};
}
const saldoPacote=id=>{const p=S.pct.get(id);return p?(+p.qtd||0)-(derive().uso.get(id)||0):0;};
function pacotesDe(pid){return[...S.pct.entries()].map(([id,p])=>({id,...p})).filter(p=>p.pacienteId===pid).sort((a,b)=>String(a.dataCompra).localeCompare(String(b.dataCompra)));}
function pickPacote(pid,isFalta){const t=today();return pacotesDe(pid).find(p=>saldoPacote(p.id)>0&&(!p.validade||p.validade>=t)&&(!isFalta||p.faltaConsome))||null;}
function planoAtivo(pid){for(const[id,p]of S.pla)if(p.pacienteId===pid&&p.ativo!==false)return{id,...p};return null;}
const pendDe=pid=>derive().pend.filter(p=>p.pacienteId===pid);
function proxSessao(pid){const t=today();return S.ses.find(s=>s.pacienteId===pid&&ACTIVE(s)&&s.status!=='realizado'&&s.status!=='falta'&&s.data>=t)||null;}
function conflicts(date,hora,dur,ignoreId){const a=toMin(hora),b=a+(+dur||50);return S.ses.filter(s=>s.id!==ignoreId&&s.data===date&&ACTIVE(s)&&toMin(s.hora)<b&&toMin(s.hora)+(+s.duracao||50)>a);}
function whatsMsg(s){const p=S.pac.get(s.pacienteId)||{};const c=CFG();const dia=s.data===today()?'hoje':s.data===addD(today(),1)?'amanhã':fmtDS(s.data);
  return String(c.msgWhats||DEFAULT_MSG).replace(/\{nome\}/g,String(p.nome||'').split(' ')[0]).replace(/\{dia\}/g,dia).replace(/\{hora\}/g,s.hora).replace(/\{local\}/g,s.local==='domicilio'?' em domicílio':' no consultório');}

/* ================= Banner e abas ================= */
function renderBanner(){
  const parts=[];
  if(S.dbErr==='config')parts.push(`<div class="note warn">${ic('alert')}<span class="grow"><b>App ainda não configurado.</b> Preencha o arquivo <b>config.js</b> com a URL e a chave do Supabase (passo 2 do LEIA-ME).</span></div>`);
  else if(S.dbErr==='nodb')parts.push(`<div class="note warn">${ic('wifioff')}<span class="grow">Sem conexão com o servidor. Verifique a internet do aparelho.</span></div>`);
  else if(S.dbErr)parts.push(`<div class="note warn">${ic('alert')}<span class="grow">A conexão com os dados foi interrompida. Recarregue a página para reconectar.</span></div>`);
  else if(S.timedOut)parts.push(`<div class="note warn">${ic('wifioff')}<span class="grow">Os dados ainda não foram confirmados pelo servidor. O que aparece pode estar desatualizado.</span></div>`);

/* ================= Pacientes ================= */
function filteredPac(){
  const q=norm(S.pq);const d=derive();
  return pacList().filter(p=>{
    const f=S.pst;
    if(f==='ativos'&&p.ativo===false)return false;
    if(f==='inativos'&&p.ativo!==false)return false;
    if(f==='pendencia'&&!d.pend.some(x=>x.pacienteId===p.id))return false;
    if(f==='pacote'&&!pacotesDe(p.id).some(x=>saldoPacote(x.id)>0))return false;
    if(f==='mensal'&&!planoAtivo(p.id))return false;
    if(f==='convenio'&&p.cobrancaPadrao!=='convenio')return false;
    if(q&&!norm([p.nome,p.telefone,p.convenio,p.bairro,p.email].join(' ')).includes(q)&&!String(p.telefone||'').replace(/\D/g,'').includes(q.replace(/\D/g,'')||'§'))return false;
    return true;
  });
}

let lastFocus=null;

  const f=$('#modal-root').querySelector('input:not([type=radio]):not([type=checkbox]):not([type=hidden]),select,textarea');

}
function closeModal(){$('#modal-root').innerHTML='';S.open=null;if(lastFocus&&lastFocus.isConnected)lastFocus.focus();}
const X=`<button type="button" class="x" data-action="close" aria-label="Fechar">${ic('x','lg')}</button>`;
function confirmBox(title,msg,okLabel,danger){
  return new Promise(res=>{
    const root=document.createElement('div');
    root.innerHTML=`<div class="backdrop" style="z-index:30"><div class="modal" role="alertdialog" aria-modal="true"><div class="modal-h"><h2><span class="hb" ${danger?'style="background:var(--crit-bg);color:var(--crit)"':''}>${ic(danger?'trash':'info')}</span>${esc(title)}</h2></div><div class="modal-b"><p style="margin:0">${esc(msg)}</p></div><div class="modal-f"><button class="btn" data-c="0">Cancelar</button><button class="btn primary" data-c="1">${ic('check')} ${esc(okLabel)}</button></div></div></div>`;
    document.body.appendChild(root);root.querySelector('[data-c="0"]').focus();
    root.addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;root.remove();res(b.dataset.c==='1');});
  });
}
function toast(msg,kind){const t=document.createElement('div');t.className='toast'+(kind==='err'?' err':'');t.innerHTML=ic(kind==='err'?'alert':'okcircle','lg');const sp=document.createElement('span');sp.textContent=msg;t.appendChild(sp);$('#toasts').appendChild(t);setTimeout(()=>t.remove(),kind==='err'?6000:3200);}

/* ================= Escrita ================= */
function errMsg(code){
  if(code==='invalid_argument')return'Não foi possível salvar: seu usuário não tem permissão ou a sessão expirou. Saia e entre de novo.';
  if(code==='quota_exceeded')return'O limite de armazenamento foi atingido. Exporte e remova registros antigos.';
  if(code==='resource_exhausted')return'Muitas operações seguidas. Aguarde alguns segundos e tente de novo.';
  if(code==='revoked')return'Seu acesso a estes dados foi alterado.';
  return'Falha de conexão. Tente de novo em instantes.';
}
async function write(fn,quiet){
  try{await fn();return true;}
  catch(e){
    const code=e&&e.code;
    if(code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*900));try{await fn();return true;}catch(e2){if(!quiet)toast(errMsg(e2&&e2.code),'err');return false;}}
    if(code==='invalid_argument'){writable=false;renderBanner();renderBody();}
    if(!quiet)toast(errMsg(code),'err');return false;
  }
}

function defaultValor(p,cob){const c=CFG();if(cob==='convenio')return p&&p.valorConvenio!=null?p.valorConvenio:'';if(cob==='avulsa')return p&&p.valorSessao!=null?p.valorSessao:c.valorPadrao;return'';}
function pacOptions(pacs,sel,q){const nq=norm(q);const l=nq?pacs.filter(x=>norm(x.nome).includes(nq)||x.id===sel):pacs;return(sel?'':'<option value="">Selecione…</option>')+l.map(x=>`<option value="${esc(x.id)}" ${x.id===sel?'selected':''}>${esc(x.nome)}</option>`).join('');}
function applySes(){
  const f=$('#form-ses');if(!f)return;

  f.querySelectorAll('[data-show]').forEach(el=>{const k=el.dataset.show;el.hidden=k==='dom'?loc!=='domicilio':k==='val'?!(cob==='avulsa'||cob==='convenio'):k==='conv'?cob!=='convenio':k==='rep'?!rep:false;});

  if(!p){h.className='hint';h.innerHTML=ic('info')+'<span>Escolha o paciente.</span>';return;}
  let lvl='',msg='';
  if(cob==='pacote'){const pk=pacotesDe(pid).filter(x=>saldoPacote(x.id)>0);const sd=pk.reduce((a,x)=>a+saldoPacote(x.id),0);const ag=S.ses.filter(s=>s.pacienteId===pid&&s.cobranca==='pacote'&&!s.pacoteId&&ACTIVE(s)&&s.status!=='falta').length;
    if(!pk.length){lvl='warn';msg='Paciente sem pacote com saldo. A sessão será descontada do próximo pacote cadastrado.';}else{msg=`Saldo do pacote: <b>${sd} sessões</b> · ${ag} já agendadas no pacote.`;if(ag>=sd)lvl='warn';}}
  else if(cob==='mensalidade'){const pl=planoAtivo(pid);if(!pl){lvl='warn';msg='Paciente sem mensalidade ativa. Cadastre a mensalidade na ficha do paciente.';}else msg=`Coberta pela mensalidade de ${money(pl.valor)}.`;}

async function submitSes(f){
  const err=t=>{$('#ses-err').textContent=t;};

  const pid=f.paciente.value;const p=S.pac.get(pid);if(!p)return err('Escolha o paciente.');
  const data=f.data.value,hora=f.hora.value;if(!data)return err('Informe a data.');if(!hora)return err('Informe o horário.');
  const dur=f.duracao.valueAsNumber||50;if(dur<10||dur>240)return err('A duração deve ficar entre 10 e 240 minutos.');
  const cob=f.cobranca.value,local=f.local.value;
  let valor=null;if(cob==='avulsa'||cob==='convenio'){valor=f.valor.value===''?null:r2(f.valor.valueAsNumber);if(cob==='avulsa'&&!(valor>=0))return err('Informe o valor da sessão.');}
  const base={pacienteId:pid,hora,duracao:dur,local,endereco:local==='domicilio'?f.endereco.value.trim():'',cobranca:cob,valor,guia:cob==='convenio'?f.guia.value.trim():'',obs:f.obs.value.trim()};
  if(local==='domicilio'&&!base.endereco)return err('Informe o endereço do atendimento domiciliar.');

  const rep=f.repetir&&f.repetir.checked;
  if(rep){
    const dias=[...f.querySelectorAll('input[name=dias]:checked')].map(x=>+x.value);if(!dias.length)return err('Escolha pelo menos um dia da semana.');
    const sem=Math.min(26,Math.max(1,f.semanas.valueAsNumber||1));dates=[];
    const end=addD(monday(data),sem*7-1);
    for(let d=data;d<=end;d=addD(d,1))if(dias.includes(wd(d)))dates.push(d);
    if(!dates.length)return err('Nenhuma data gerada. Confira os dias e a data de início.');
    if(dates.length>60)return err('Gere no máximo 60 sessões de uma vez.');
  }
  const cfl=dates.filter(d=>conflicts(d,hora,dur,id).length);
  if(cfl.length&&f.dataset.force!=='1'){f.dataset.force='1';f.querySelector('[type=submit]').innerHTML=ic('check')+' Salvar mesmo assim';return err(`Há outra sessão no mesmo horário em ${cfl.length===1?fmtDS(cfl[0]):cfl.length+' datas'}. Clique de novo para salvar assim mesmo.`);}
  const btn=f.querySelector('[type=submit]');btn.disabled=true;
  let ok=true;
  if(id){ok=await write(()=>col('sessoes').doc(id).update({...base,data,atualizadoEm:new Date().toISOString()}));}
  else if(remId){
    const ref=col('sessoes').doc();
    ok=await write(()=>ref.set({...base,data,status:'agendado',reposicaoDe:remId,...stamp()}));
    if(ok)ok=await write(()=>col('sessoes').doc(remId).update({status:'remarcado',remarcadaPara:ref.id}));
  } else {

async function setStatus(id,st,extra){
  const s=S.ses.find(x=>x.id===id);if(!s)return false;

    if(st==='falta'&&s.pacoteId){const p=S.pct.get(s.pacoteId);if(p&&!p.faltaConsome)data.pacoteId=null;}

}

/* ================= Finalizar atendimento: sinais vitais e evolução ================= */
function vitHTML(v){v=v||{};const it=[];
  if(v.pa)it.push(`<span class="pill">${ic('gauge')}PA ${esc(v.pa)} mmHg</span>`);
  if(v.fc!=null&&v.fc!=='')it.push(`<span class="pill">${ic('heart')}FC ${esc(v.fc)} bpm</span>`);
  if(v.spo2!=null&&v.spo2!=='')it.push(`<span class="pill">${ic('droplet')}SpO₂ ${esc(v.spo2)}%</span>`);
  return it.length?`<div class="vit">${it.join('')}</div>`:'';}
function evolHTML(s,can){
  const v=vitHTML(s.sinais);
  if(!s.evolucao&&!v)return can?`<div class="hint warn">${ic('note')}<span class="grow">Atendimento sem evolução registrada. <button class="linkbtn" data-action="finalizar" data-id="${esc(s.id)}">Registrar evolução ${ic('arrowright')}</button></span></div>`:'';
  return `<div class="sec"><div class="panel-h" style="margin-bottom:6px"><h3>${ic('clipboard')}Evolução do atendimento</h3>${can?`<button class="btn sm ghost" data-action="finalizar" data-id="${esc(s.id)}">${ic('pencil')} Editar</button>`:''}</div>${v}${s.evolucao?`<p class="evol">${esc(s.evolucao)}</p>`:''}</div>`;}
function vitFields(v,pre){v=v||{};const val=x=>v[x]!=null?esc(v[x]):'';
  return `<label class="field"><span>${ic('gauge')}Pressão arterial (mmHg)</span><input name="${pre}pa" value="${val('pa')}" maxlength="9" inputmode="numeric" placeholder="120/80"></label>
      <label class="field"><span>${ic('heart')}Frequência cardíaca (bpm)</span><input name="${pre}fc" type="number" min="20" max="250" step="1" value="${val('fc')}" placeholder="75"></label>
      <label class="field"><span>${ic('droplet')}Saturação SpO₂ (%)</span><input name="${pre}spo2" type="number" min="50" max="100" step="1" value="${val('spo2')}" placeholder="98"></label>`;}
function lerVitais(f,pre){
  const pa0=f.elements[pre+'pa'].value.trim(),fc0=f.elements[pre+'fc'].value.trim(),sp0=f.elements[pre+'spo2'].value.trim();
  let pa='';if(pa0){const m=pa0.match(/^(\d{2,3})\s*[\/xX×]\s*(\d{2,3})$/);if(!m)return{erro:'Pressão arterial: use o formato 120/80.'};const a=+m[1],b=+m[2];if(a<50||a>260||b<30||b>160||b>=a)return{erro:'Confira a pressão arterial: '+pa0+' não parece um valor válido.'};pa=a+'/'+b;}
  let fc=null;if(fc0){fc=Math.round(+fc0);if(!(fc>=20&&fc<=250))return{erro:'Frequência cardíaca deve ficar entre 20 e 250 bpm.'};}
  let spo2=null;if(sp0){spo2=Math.round(+sp0);if(!(spo2>=50&&spo2<=100))return{erro:'Saturação deve ficar entre 50% e 100%.'};}
  return{v:{pa,fc,spo2}};}

    if(!f.senha.value){e1.textContent='Digite a senha.';return;}
    const btn=f.querySelector('[type=submit]');btn.disabled=true;btn.textContent='Entrando…';
    try{const ses=await Dados.entrar(cpf,f.senha.value);e1.textContent='';await iniciar(ses);}
    catch(err){e1.textContent=/Invalid login/i.test(err&&err.message||'')?'CPF ou senha incorretos.':'Não foi possível entrar agora. Verifique a internet e tente de novo.';}
    btn.disabled=false;btn.textContent='Entrar';
  }
  else if(f.id==='form-cfg'){
    const g=n=>f.elements[n];const vp=g('valorPadrao').valueAsNumber,dp=g('duracaoPadrao').valueAsNumber;
    if(toMin(g('fimDia').value)<=toMin(g('inicioDia').value)){$('#cfg-err').textContent='O fim do expediente deve ser depois do início.';return;}
    const data={nomeProfissional:g('nomeProfissional').value.trim(),crefito:g('crefito').value.trim(),documento:g('documento').value.trim(),telefone:g('telefone').value.trim(),endereco:g('endereco').value.trim(),cidade:g('cidade').value.trim(),pix:g('pix').value.trim(),
      valorPadrao:vp>=0?r2(vp):120,duracaoPadrao:dp>=10?Math.round(dp):50,inicioDia:g('inicioDia').value||'07:00',fimDia:g('fimDia').value||'19:00',prazoPagamento:Math.max(0,Math.min(60,Math.round(g('prazoPagamento').valueAsNumber||0))),msgWhats:g('msgWhats').value.trim()||DEFAULT_MSG,simboloOficial:S.cfg.simboloOficial||''};
    const btn=f.querySelector('[type=submit]');btn.disabled=true;const ok=await write(()=>db.doc('config/geral').set(data));btn.disabled=false;if(ok){$('#cfg-err').textContent='';toast('Ajustes salvos.');}
  }
});
window.addEventListener('hashchange',route);

/* ================= Dados ================= */
function refresh(){
  D=null;renderBanner();
  if(S.tab!=='ajustes'||!$('#form-cfg'))renderBody();
  if(S.open&&$('#drawer')){if(S.open.t==='pac')pacDrawer(S.open.id);else sesDrawer(S.open.id);}
}
function checkLive(){if(Object.keys(COLLS).every(k=>S.live[k])&&S.live.cfg){clearTimeout(loadTimer);S.timedOut=false;}}
function cpfValido(c){c=String(c||'').replace(/\D/g,'');if(c.length!==11||/^(\d)\1{10}$/.test(c))return false;let t=0;for(let i=0;i<9;i++)t+=+c[i]*(10-i);let d=(t*10)%11%10;if(d!==+c[9])return false;t=0;for(let i=0;i<10;i++)t+=+c[i]*(11-i);d=(t*10)%11%10;return d===+c[10];}
function mostrarLogin(){document.body.classList.add('locked');$('#login').hidden=false;setTimeout(()=>{const i=$('#lg-cpf');if(i)i.focus();},50);}
let iniciado=false;
async function iniciar(sessao){
  window.__sessao=sessao;document.body.classList.remove('locked');$('#login').hidden=true;
  if(iniciado){refresh();return;}iniciado=true;
  db=Dados.db;DL=DL_LOCAL;myId=sessao.user.id;applyDl();
  try{if(!(await Dados.souMembro())){writable=false;S.noAccess=true;}}catch(_){}
  loadTimer=setTimeout(()=>{S.timedOut=true;renderBanner();},12000);
  const onErr=e=>{clearTimeout(loadTimer);const perm=(e&&e.code)==='invalid_argument';S.dbErr=perm?null:'nodb';if(perm){S.noAccess=true;writable=false;}Object.keys(COLLS).forEach(k=>S.ready[k]=true);S.ready.cfg=true;refresh();};
  for(const[c,key]of Object.entries(COLLS)){
    db.collection(c).onSnapshot(snap=>{
      if(key==='ses')S.ses=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.data===b.data?String(a.hora).localeCompare(String(b.hora)):a.data<b.data?-1:1);
      else if(key==='rec')S.rec=snap.docs.map(d=>({id:d.id,...d.data()}));
      else S[key]=new Map(snap.docs.map(d=>[d.id,d.data()]));
      S.ready[c]=true;S.live[c]=true;checkLive();refresh();
    },onErr);
  }
  db.doc('config/geral').onSnapshot(snap=>{S.cfg=snap.exists?snap.data():{};S.ready.cfg=true;S.live.cfg=true;checkLive();refresh();},onErr);
  Dados.iniciarTempoReal();
}
async function boot(){
  route();
  if(!window.Dados||!Dados.configurado){S.dbErr='config';Object.keys(COLLS).forEach(k=>S.ready[k]=true);S.ready.cfg=true;writable=false;refresh();return;}
  Dados.aoMudarLogin((ev,ses)=>{if(ev==='SIGNED_OUT'){window.__sessao=null;mostrarLogin();}else if(ses)window.__sessao=ses;});
  let ses=null;try{ses=await Dados.sessao();}catch(_){}
  if(ses)iniciar(ses);else mostrarLogin();
}
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
boot();
})();
</script>
