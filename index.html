/* =====================================================================
   Design system Thays Freitas Fisioterapia (v3)
   Base neutra e sóbria (padrão de software corporativo), verde-esmeralda da marca
   como cor de ação, status com cor + ícone + texto. Tema claro e escuro.
   Tokens em :root; componentes usam só tokens.
   ===================================================================== */
:root{
  --bg:#F4F6F7; --surface:#FFFFFF; --surface-2:#F8FAFA; --surface-3:#EFF3F3; --elev:#FFFFFF;
  --ink:#0F1F1C; --ink-2:#33473F; --muted:#64766F; --line:#E2E8E7; --line-2:#EDF1F0;
  --primary:#13866A; --primary-2:#0D6B54; --primary-soft:#E5F3EE; --on-primary:#FFFFFF; --ring:rgba(19,134,106,.28);
  --chip:#EEF2F1; --mint:#E5F3EE; --accent:#E0A030; --accent-bg:#FDF3DF;
  --ok:#17804A; --ok-bg:#E6F5EC; --warn:#A45F07; --warn-bg:#FDF1DC; --crit:#C03A2B; --crit-bg:#FCEBE8; --info:#2A64C2; --info-bg:#E8F0FC;
  --lilac:#7048C4; --lilac-bg:#F0EBFC;
  --ses-bg:#FFFFFF; --ses-conf:#F4F8FE; --ses-real:#F3FAF6; --ses-falta:#FDF5F3;
  --header:var(--surface); --header-ink:var(--ink);
  --backdrop:rgba(9,20,18,.42); --toast:#13231F;
  --sh-1:0 1px 2px rgba(16,32,28,.05); --sh-2:0 1px 3px rgba(16,32,28,.07),0 1px 2px rgba(16,32,28,.04);
  --sh-3:0 18px 48px -12px rgba(16,32,28,.28); --sh-pop:0 10px 30px -6px rgba(16,32,28,.22);
  --f-display:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:12px; --r-sm:8px; --r-lg:16px; --side:248px; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0A1113; --surface:#111A1C; --surface-2:#152022; --surface-3:#1B282A; --elev:#16211F;
  --ink:#E6EEEC; --ink-2:#C3D1CD; --muted:#8FA29D; --line:#23323A; --line-2:#1C292E;
  --primary:#34BC96; --primary-2:#6AD8B8; --primary-soft:#123029; --on-primary:#03241B; --ring:rgba(52,188,150,.35);
  --chip:#1B2A2C; --mint:#123029; --accent:#F0B44E; --accent-bg:#33270F;
  --ok:#4CC584; --ok-bg:#12301F; --warn:#F0AE4B; --warn-bg:#33250D; --crit:#F27B6C; --crit-bg:#3A1A16; --info:#7FA9F2; --info-bg:#15243D;
  --lilac:#B49BF2; --lilac-bg:#251C3D;
  --ses-bg:#152022; --ses-conf:#152234; --ses-real:#13271E; --ses-falta:#2B1917;
  --backdrop:rgba(0,0,0,.6); --toast:#21322F;
  --sh-1:none; --sh-2:0 1px 2px rgba(0,0,0,.4); --sh-3:0 18px 48px -12px rgba(0,0,0,.7); --sh-pop:0 10px 30px -6px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--f-body);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.015em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
a{color:var(--info)}
[hidden]{display:none !important}
::selection{background:var(--ring)}
.ic{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em;display:inline-block}
.ic.lg{width:20px;height:20px}
.ic.xl{width:40px;height:40px;stroke-width:1.6}
.qa,.ti,.pill,.ri,.nav a[aria-current="page"]{--duo:.25}
.btn.primary{--duo:.35}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
kbd{font:600 11px/1 var(--f-body);padding:3px 6px;border-radius:5px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);box-shadow:0 1px 0 var(--line)}

/* ===== Estrutura: menu lateral + área de trabalho + barra inferior (celular) ===== */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:6px;padding:18px 14px 14px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;z-index:5}
.brand{display:flex;align-items:center;gap:11px;min-width:0;padding:2px 6px 14px}
.logo{width:40px;height:40px;flex:none;display:block}
.wordmark{display:grid;line-height:1;min-width:0}
.wordmark b{font:700 17px/1.1 var(--f-display);letter-spacing:-.02em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wordmark span{font:700 9.5px/1 var(--f-body);letter-spacing:.3em;text-transform:uppercase;color:var(--primary);margin-top:5px}
#brand-sub{margin:4px 0 0;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#brand-oficial{height:30px;width:auto;margin-left:auto}
.nav{display:grid;gap:2px}
.nav-t{font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 8px}
.nav a{display:flex;align-items:center;gap:11px;color:var(--ink-2);text-decoration:none;font-weight:550;padding:9px 10px;border-radius:9px;position:relative}
.nav a .ic{width:19px;height:19px;color:var(--muted)}
.nav a:hover{background:var(--surface-3);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--primary-soft);color:var(--primary-2);font-weight:650}
.nav a[aria-current="page"] .ic{color:var(--primary)}
.nav .badge{margin-left:auto}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--crit);color:#fff;font:700 11px/20px var(--f-body);text-align:center}
.badge.soft{background:var(--chip);color:var(--ink-2)}
.side-f{margin-top:auto;display:grid;gap:4px;border-top:1px solid var(--line);padding-top:10px}
.side-f button,.side-f a{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--ink-2);padding:8px 10px;border-radius:9px;cursor:pointer;font-weight:550;text-decoration:none;text-align:left}
.side-f button:hover{background:var(--surface-3)}
.side-f .ic{color:var(--muted)}
.side-f kbd{margin-left:auto}
.who{display:flex;align-items:center;gap:10px;padding:8px 10px 2px;font-size:12.5px;color:var(--muted);min-width:0}
.who .av{width:30px;height:30px;font-size:12px}
.who b{display:block;color:var(--ink);font-weight:600;font-size:13px}

.work{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:4;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:14px}
.ptitle{min-width:0;flex:1}
.ptitle h1{font-size:21px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle p{margin:1px 0 0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle p::first-letter{text-transform:uppercase}
.mlogo{display:none}
.gsearch{display:flex;align-items:center;gap:9px;width:min(340px,32vw);padding:8px 10px 8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted);cursor:pointer;text-align:left;box-shadow:var(--sh-1)}
.gsearch:hover{border-color:var(--muted)}
.gsearch span{flex:1;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1100px){.gsearch kbd{display:none}}
.tbtn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;color:var(--ink-2);flex:none}
.tbtn:hover{border-color:var(--muted)}
.tbtn.on{background:var(--primary-soft);color:var(--primary-2);border-color:transparent}
.tbtn.mob{display:none}
.bnav{display:none}

/* ===== Botões ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;min-height:38px;box-shadow:var(--sh-1);transition:background .12s,border-color .12s,box-shadow .12s,filter .12s}
.btn:hover{border-color:var(--muted);background:var(--surface-2)}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary);box-shadow:0 1px 2px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.12)}
.btn.primary:hover{filter:brightness(1.07);background:var(--primary)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-3);border-color:transparent}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.btn.danger:hover{background:var(--crit-bg)}
.btn.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.btn.ok:hover{background:var(--ok-bg)}
.btn.sm{padding:4px 10px;font-size:13px;min-height:30px;border-radius:8px;gap:5px}
.btn.icon{padding:0;width:38px}
.btn.sm.icon{width:30px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--primary-2);cursor:pointer;padding:0;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.linkbtn:hover{text-decoration:underline}

main{max-width:1320px;width:100%;margin:0 auto;padding:6px 28px 48px;display:grid;gap:18px;align-content:start}
main > *,#body > *{min-width:0}
#body{display:grid;gap:18px;min-width:0}
#banner{max-width:1320px;width:100%;margin:0 auto;padding:0 28px}
#banner:empty{display:none}
.note{margin-top:10px;padding:10px 14px;border-radius:var(--r);display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line)}
.note > .ic{width:20px;height:20px}
.note.warn{background:var(--warn-bg);border-color:transparent} .note.warn > .ic{color:var(--warn)}
.note.info{background:var(--info-bg);border-color:transparent} .note.info > .ic{color:var(--info)}
.note .grow{flex:1;min-width:200px}

/* ===== Indicadores (cartões de número) ===== */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh-1)}
.tile .ti{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.tile .k{font-size:13px;font-weight:550;color:var(--muted);padding-right:44px}
.tile .v{font:700 26px/1.15 var(--f-display);margin-top:8px;letter-spacing:-.02em}
.tile .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.tile.warn .ti{background:var(--warn-bg);color:var(--warn)} .tile.warn .v{color:var(--warn)}
.tile.crit .ti{background:var(--crit-bg);color:var(--crit)} .tile.crit .v{color:var(--crit)}
.tile.ok .ti{background:var(--ok-bg);color:var(--ok)}
.tile .ti.amber{background:var(--accent-bg);color:var(--warn)}.tile .ti.lilac{background:var(--lilac-bg);color:var(--lilac)}.tile .ti.blue{background:var(--info-bg);color:var(--info)}

/* Painel executivo */
.dash-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dash-h h2{font-size:22px;font-weight:700}
.dash-h p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.mswitch{display:inline-flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:var(--sh-1)}
.mswitch button{border:0;background:none;width:32px;height:32px;border-radius:7px;cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.mswitch button:hover{background:var(--surface-3)}
.mswitch b{min-width:132px;text-align:center;font-weight:650;font-size:14px}
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{position:relative;display:grid;gap:4px;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px 14px;box-shadow:var(--sh-1);text-align:left;color:inherit;font:inherit;min-width:0}
button.kpi{cursor:pointer}
button.kpi:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--line));box-shadow:var(--sh-2)}
.kpi .k{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--muted)}
.kpi .k .ic{width:15px;height:15px;color:var(--primary)}
.kpi.crit .k .ic{color:var(--crit)} .kpi.warn .k .ic{color:var(--warn)}
.kpi .v{font:700 25px/1.15 var(--f-display);letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.crit .v{color:var(--crit)}
.kpi .s{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.kpi .spark{position:absolute;right:14px;top:14px;width:64px;height:24px;opacity:.9}
.kpi .spark path{fill:none;stroke:var(--primary);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.kpi .spark .ar{fill:var(--primary);opacity:.1;stroke:none}
.delta{display:inline-flex;align-items:center;gap:2px;font-weight:650;font-size:12px;padding:1px 6px;border-radius:999px;background:var(--chip);color:var(--ink-2)}
.delta.up{background:var(--ok-bg);color:var(--ok)} .delta.down{background:var(--crit-bg);color:var(--crit)}
.delta .ic{width:12px;height:12px;stroke-width:2.6}
.meter{height:6px;border-radius:999px;background:var(--chip);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:999px;background:var(--primary)}
.dgrid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:18px;align-items:start}
.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}
.dcol{display:grid;gap:18px;min-width:0}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--line-2);stroke-width:1}
.chart .ax{fill:var(--muted);font:500 11px var(--f-body)}
.chart .bar{fill:color-mix(in srgb,var(--primary) 34%,var(--surface));cursor:pointer;transition:fill .12s}
.chart .bar.sel{fill:var(--primary)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover + .bar,.chart g:hover .bar{fill:color-mix(in srgb,var(--primary) 70%,var(--surface))}
.chart g:hover .bar.sel{fill:var(--primary-2)}
.chart .lbl{fill:var(--ink-2);font:650 11px var(--f-body)}
.tip{position:absolute;pointer-events:none;background:var(--elev);border:1px solid var(--line);box-shadow:var(--sh-pop);border-radius:10px;padding:8px 11px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));z-index:3}
.tip b{display:block;font-size:13.5px}
.tip span{color:var(--muted)}
.hbars{display:grid;gap:11px}
.hb-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;align-items:center;font-size:13.5px}
.hb-row .n{display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2);font-weight:550}
.hb-row .n .ic{width:15px;height:15px;color:var(--muted)}
.hb-row .q{font-weight:650}
.hb-row .q small{color:var(--muted);font-weight:500;margin-left:6px}
.hb-row .tr{grid-column:1 / -1;height:7px;border-radius:999px;background:var(--chip);overflow:hidden}
.hb-row .tr i{display:block;height:100%;border-radius:999px;background:var(--c,var(--primary))}
.stack{display:flex;height:12px;border-radius:999px;overflow:hidden;gap:2px;background:var(--surface);margin:4px 0 12px}
.stack i{display:block;height:100%;background:var(--c)}
.stack i:first-child{border-radius:999px 0 0 999px}.stack i:last-child{border-radius:0 999px 999px 0}.stack i:only-child{border-radius:999px}
.legend2{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2)}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
.legend2 i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.legend2 b{font-weight:650}
.todo{display:grid;gap:2px}
.td{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line-2)}
.td:last-child{border-bottom:0}
.td .ri{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--chip);color:var(--ink-2)}
.td.crit .ri{background:var(--crit-bg);color:var(--crit)} .td.warn .ri{background:var(--warn-bg);color:var(--warn)} .td.ok .ri{background:var(--ok-bg);color:var(--ok)} .td.info .ri{background:var(--info-bg);color:var(--info)} .td.lilac .ri{background:var(--lilac-bg);color:var(--lilac)}
.td .tt{min-width:0}
.td .tt > b{display:block;font-weight:600;font-size:14px}
.td .tt span{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td .ta{display:flex;gap:6px;align-items:center}
.today{display:grid;gap:0}
.tr2{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line-2);cursor:pointer;border-radius:8px}
.tr2:hover{background:var(--surface-2)}
.tr2:last-child{border-bottom:0}
.tr2 .h{font:700 14px/1 var(--f-display)}
.tr2 .h small{display:block;font:500 11.5px var(--f-body);color:var(--muted);margin-top:4px}
.tr2 .nm{min-width:0}
.tr2 .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr2 .nm span{font-size:12.5px;color:var(--muted)}
.tr2.past{opacity:.72}
.tr2.now{background:var(--primary-soft)}
.seemore{display:flex;justify-content:center;padding-top:10px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0;box-shadow:var(--sh-1)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.panel h2{font-size:15.5px;font-weight:650;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.panel h2 > .ic{color:var(--primary);width:18px;height:18px}
.panel > h2{margin-bottom:14px}
.panel-h .sub{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
.emptybox{display:grid;justify-items:center;gap:8px;text-align:center;color:var(--muted);padding:22px 10px}
.emptybox .ic{color:var(--line)}
.mini{display:inline-flex;align-items:center;gap:5px}
.mini .ic{width:14px;height:14px}
.muted{color:var(--muted)}
.pos{color:var(--ok);font-weight:600}
.neg{color:var(--crit);font-weight:600}

/* ===== Pílulas de status ===== */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--chip);color:var(--ink-2);line-height:1.5}
.pill .ic{width:12.5px;height:12.5px;stroke-width:2.4}
.pill.agendado{background:var(--chip);color:var(--ink-2)}
.pill.confirmado{background:var(--info-bg);color:var(--info)}
.pill.realizado{background:var(--ok-bg);color:var(--ok)}
.pill.falta{background:var(--crit-bg);color:var(--crit)}
.pill.cancelado{background:var(--chip);color:var(--muted)}
.pill.remarcado{background:var(--warn-bg);color:var(--warn)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}

/* ===== Agenda ===== */
.agbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg2{display:inline-flex;background:var(--surface-3);border-radius:10px;padding:3px;border:1px solid var(--line)}
.seg2 button{border:0;background:none;padding:6px 13px;border-radius:7px;cursor:pointer;font-weight:600;display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:13.5px}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-2)}
.agbar input[type=date],.toolbar input[type=date]{padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:38px}
.agbar .chk{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted)}
.agbar .grow{flex:1}
.navg{display:inline-flex;gap:6px}
.daysum{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dayhead h2{font-size:19px;font-weight:700}
.dayhead h2::first-letter{text-transform:uppercase}
.timeline{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-1)}
.slot{display:grid;grid-template-columns:72px 1fr;border-bottom:1px solid var(--line-2);min-height:56px}
.slot:last-child{border-bottom:0}
.slot .hr{font:600 13px/1 var(--f-display);color:var(--muted);padding:16px 0 0 18px}
.slot.now .hr{color:var(--primary);font-weight:700}
.slot.now{background:linear-gradient(90deg,var(--mint),transparent 45%)}
.slot .cards{display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px 8px 0;align-items:flex-start}
.free{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;width:100%;opacity:.75}
.free:hover{border-color:var(--primary);color:var(--primary);opacity:1;background:var(--primary-soft)}
.ses{display:grid;gap:3px;text-align:left;border:1px solid var(--line);background:var(--ses-bg);border-radius:9px;padding:8px 12px 9px 14px;cursor:pointer;min-width:220px;flex:1 1 240px;box-shadow:inset 3px 0 0 var(--stripe,var(--line)),var(--sh-1);transition:border-color .12s,box-shadow .12s}
.ses:hover{border-color:color-mix(in srgb,var(--stripe,var(--muted)) 55%,var(--line));box-shadow:inset 3px 0 0 var(--stripe,var(--line)),var(--sh-2)}
.ses .sh{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.ses .sh b{font:700 14px/1 var(--f-display);color:var(--ink)}
.ses .sn{font-weight:650;font-size:14.5px}
.ses .sm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.ses.st-confirmado{--stripe:var(--info);background:var(--ses-conf)}
.ses.st-realizado{--stripe:var(--ok);background:var(--ses-real)}
.ses.st-falta{--stripe:var(--crit);background:var(--ses-falta)}
.ses.st-agendado{--stripe:var(--muted)}
.ses.st-cancelado,.ses.st-remarcado{opacity:.6;--stripe:var(--line)}
.ses.st-cancelado .sn{text-decoration:line-through}
.ses.atraso{--stripe:var(--warn)}
.ses.compact{min-width:0;flex:none;width:100%;padding:6px 8px 7px 11px}
.ses.compact .sn{font-size:13.5px}
.week{display:grid;grid-template-columns:repeat(var(--cols,6),minmax(0,1fr));gap:10px}
.wcol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:7px;align-content:start;min-width:0;box-shadow:var(--sh-1)}
.wcol.today{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.wh{display:flex;justify-content:space-between;align-items:center;border:0;background:none;cursor:pointer;padding:2px 2px 7px;font-weight:700;border-bottom:1px solid var(--line);text-align:left;color:var(--ink)}
.wh span{font-family:var(--f-display);font-size:14px;text-transform:capitalize}
.wh small{color:var(--muted);font-weight:600}
.wh .ic{width:14px;height:14px;color:var(--primary);margin-right:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}

/* ===== Pacientes ===== */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .grow{flex:1}
.toolbar select,.toolbar input[type=month]{padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:38px}
.search{position:relative;flex:1 1 260px;display:flex;color:var(--muted)}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%)}
.search input{width:100%;min-width:180px;padding:8px 12px 8px 36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:38px}
.search input:focus,.field input:focus,.field select:focus,.field textarea:focus,.toolbar select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--ring)}
.count{font-size:12.5px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:9px;align-content:start;cursor:pointer;text-align:left;box-shadow:var(--sh-1);transition:border-color .12s,box-shadow .12s}
.pcard:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--line));box-shadow:var(--sh-2)}
.pcard.off{opacity:.6}
.pcard .ph{display:flex;align-items:center;gap:11px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 14px/1 var(--f-display);flex:none;background:var(--avbg,var(--chip));color:var(--avfg,var(--primary))}
:root[data-theme="dark"] .av{filter:saturate(.8) brightness(.85)}
.pcard .pn{font-weight:650;font-size:15px;line-height:1.25}
.pcard .pl{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.pcard .pf{display:flex;flex-wrap:wrap;gap:6px}
.wa{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-weight:600;text-decoration:none}
.pname{display:flex;align-items:center;gap:10px;min-width:0}
.pname b{font-weight:600}
.pname small{display:block;color:var(--muted);font-size:12px}

/* ===== Tabelas ===== */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{font-size:11.5px;font-weight:650;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.t th .ic{width:13px;height:13px;margin-right:4px;vertical-align:-.15em}
.t td{padding:10px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.t tbody tr:hover td{background:var(--surface-2)}
.t tr[data-action]{cursor:pointer}
.t tr:last-child td{border-bottom:0}
.t .r{text-align:right}
.t .acts{white-space:nowrap;text-align:right}
.t .acts > * + *{margin-left:4px}
.rows{display:grid;gap:6px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2);box-shadow:inset 3px 0 0 var(--stripe,transparent);color:inherit;font:inherit}
.row.crit{--stripe:var(--crit)} .row.warn{--stripe:var(--warn)} .row.ok{--stripe:var(--ok)}
.row .ri{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--chip);color:var(--primary)}
.row.crit .ri{background:var(--crit-bg);color:var(--crit)} .row.warn .ri{background:var(--warn-bg);color:var(--warn)}
.row .rt{min-width:0}
.row .rt > b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.row .rt span{font-size:12.5px;color:var(--muted)}
.row .rv{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:14px}
.bar .track{grid-column:1 / -1;height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--primary);border-radius:4px}

/* ===== Janelas (modal) ===== */
.backdrop{position:fixed;inset:0;background:var(--backdrop);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow-y:auto;z-index:20}
.modal{background:var(--surface);color:var(--ink);border-radius:var(--r-lg);width:100%;max-width:640px;box-shadow:var(--sh-3);border:1px solid var(--line)}
.modal.wide{max-width:980px}
.modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 22px 8px}
.modal-h h2{font-size:19px;display:flex;align-items:center;gap:11px}
.hb{width:36px;height:36px;border-radius:10px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}
.hb .ic{width:19px;height:19px}
.modal-b{padding:6px 22px 22px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.modal-b .grid2 > *,.modal-b .sec{min-width:0}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:13px 22px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg);flex-wrap:wrap}
.x{background:none;border:0;cursor:pointer;color:var(--muted);padding:5px;border-radius:8px}
.x:hover{background:var(--surface-3);color:var(--ink)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 16px}
.field{display:grid;gap:5px;min-width:0}
.field.full{grid-column:1 / -1}
.field > span{font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.field > span .ic{width:14px;height:14px;color:var(--muted)}
.field input,.field select,.field textarea{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);width:100%;min-height:40px;transition:border-color .12s,box-shadow .12s}
.field input:hover,.field select:hover,.field textarea:hover{border-color:color-mix(in srgb,var(--muted) 60%,var(--line))}
.field textarea{min-height:68px;resize:vertical}
.field small{color:var(--muted);font-size:12px}
.req::after{content:"*";color:var(--crit);margin-left:2px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.opt span{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-weight:600;font-size:13.5px;background:var(--surface)}
.opt span:hover{border-color:var(--muted)}
.opt input:checked + span{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-2);box-shadow:inset 0 0 0 1px var(--primary)}
.opt input:focus-visible + span{outline:2px solid var(--primary);outline-offset:2px}
.hint{padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:13.5px;display:flex;gap:9px;align-items:flex-start}
.hint .ic{margin-top:2px;color:var(--muted)}
.hint.warn{background:var(--warn-bg);border-color:transparent}.hint.warn .ic{color:var(--warn)}
.hint.crit{background:var(--crit-bg);border-color:transparent}
.formerr{color:var(--crit);font-weight:600}
.ftabs{margin-bottom:14px}
.fsub{grid-column:1 / -1;margin:6px 0 0;font:650 13px/1.2 var(--f-body);color:var(--primary-2);display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.04em}
.aval{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}
.aval > div{min-width:0}.aval .full{grid-column:1 / -1}
.aval b{display:block;font-size:12px;color:var(--muted);font-weight:600}
.aval p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.vit{display:flex;flex-wrap:wrap;gap:6px}
.evol{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 0}
.formerr:empty{display:none}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13.5px;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta .ic{color:var(--primary)}
.meta b{color:var(--ink);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpis > div{background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px}
.kpis .k{font-size:12px;font-weight:600;color:var(--muted);display:flex;gap:5px;align-items:center}
.kpis .k .ic{width:13px;height:13px}
.kpis .v{font:700 20px/1.2 var(--f-display);margin-top:3px;letter-spacing:-.02em}
.sec h3{font-size:14.5px;font-weight:650;display:flex;align-items:center;gap:7px;margin-bottom:9px}
.sec h3 .ic{color:var(--primary)}
.chk{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--primary)}

/* Busca global (paleta de comandos) */
.pal{max-width:620px;overflow:hidden}
.pal-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.pal-in .ic{width:19px;height:19px;color:var(--muted)}
.pal-in input{flex:1;border:0;background:none;font-size:16px;outline:none;min-width:0}
.pal-l{max-height:min(60vh,460px);overflow-y:auto;padding:6px}
.pal-g{font:650 11px/1 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:12px 10px 6px}
.pal-i{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:9px 10px;border-radius:9px;cursor:pointer;text-align:left;color:var(--ink)}
.pal-i .ic{color:var(--muted);width:17px;height:17px}
.pal-i .av{width:28px;height:28px;font-size:11px;flex:none}
.pal-i > span:not(.av){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-i small{color:var(--muted);font-size:12px;margin-left:8px}
.pal-i kbd{margin-left:auto}
.pal-i[aria-selected="true"]{background:var(--primary-soft)}
.pal-i[aria-selected="true"] .ic{color:var(--primary)}
.pal-f{display:flex;gap:14px;flex-wrap:wrap;padding:9px 14px;border-top:1px solid var(--line);background:var(--surface-2);font-size:12px;color:var(--muted)}
.pal-f span{display:inline-flex;gap:5px;align-items:center}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 22px}
.keys div{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.keys kbd + kbd{margin-left:3px}

/* Ações rápidas */
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.qa{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:650;text-align:left;font-size:14.5px;color:var(--ink);box-shadow:var(--sh-1)}
.qa:hover{border-color:color-mix(in srgb,var(--primary) 45%,var(--line));box-shadow:var(--sh-2)}
.qa small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:1px}
.qa kbd{margin-left:auto}
.qi{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--primary-soft);color:var(--primary-2)}
.qi .ic{width:20px;height:20px}
.qi.amber{background:var(--accent-bg);color:var(--warn)}.qi.lilac{background:var(--lilac-bg);color:var(--lilac)}.qi.blue{background:var(--info-bg);color:var(--info)}
.free .ic.soft{color:var(--accent)}
.logo-prev{background:linear-gradient(135deg,#FFFFFF,#E5F3EE);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.logo-prev svg{max-width:100%;height:auto}
.oficial-box{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.oficial-box img{height:72px;width:auto;border-radius:8px;background:#fff;border:1px solid var(--line);padding:4px}
.wa-chip{border:0;cursor:pointer;background:var(--ok-bg) !important;color:var(--ok) !important;font:inherit;font-size:12px;font-weight:650}
.wa-chip:hover{filter:brightness(.96)}
.wa-chip.sent{background:var(--chip) !important;color:var(--muted) !important}
.ses.compact .wa-chip{padding:2px 6px}
.cfg-nav{display:flex;gap:6px;flex-wrap:wrap}

#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:60;width:min(92vw,460px)}
.toast{background:var(--toast);color:#fff;padding:11px 16px;border-radius:12px;box-shadow:var(--sh-3);display:flex;gap:10px;align-items:center;font-weight:500}
.toast .ic{color:#7FD6A3} .toast.err .ic{color:#F08177}
.skel{color:var(--muted);padding:30px 0;text-align:center}
.sk{display:grid;gap:14px}
.sk i{display:block;height:96px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface) 0%,var(--surface-3) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.3s linear infinite;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}

/* Modo privado: esconde valores em dinheiro (quando o paciente está olhando a tela) */
body.privado .kpi .v.money,body.privado .tile .v,body.privado .rv,body.privado td.r,body.privado .money,body.privado .kpis .v{filter:blur(7px);user-select:none}

/* Etapa 2: combobox de paciente, dados opcionais, desfazer, bloqueio */
.combo{position:relative}
.combo input{width:100%}
.combo-l{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--elev);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh-pop);padding:4px;max-height:280px;overflow-y:auto}
.combo-l button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;color:var(--ink)}
.combo-l button[aria-selected="true"],.combo-l button:hover{background:var(--primary-soft)}
.combo-l .av{width:26px;height:26px;font-size:10.5px}
.combo-l small{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}
.combo-l .none{padding:10px;color:var(--muted);font-size:13px}
.freq{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.freq button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 3px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2)}
.freq button:hover{border-color:var(--primary);background:var(--primary-soft)}
.freq .av{width:24px;height:24px;font-size:10px}
.freq-t{font-size:12px;color:var(--muted)}
.pick{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--primary);background:var(--primary-soft);border-radius:10px}
.pick b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .av{width:30px;height:30px;font-size:11px}
details.more{border:1px dashed var(--line);border-radius:10px;padding:0 12px}
details.more[open]{padding-bottom:12px}
details.more > summary{cursor:pointer;padding:10px 0;font-size:13px;font-weight:600;color:var(--primary-2);list-style:none;display:flex;align-items:center;gap:6px}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::before{content:"+";font-weight:700;width:14px;text-align:center}
details.more[open] > summary::before{content:"–"}
details.convg{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--surface)}
details.convg > summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px}
details.convg > summary::-webkit-details-marker{display:none}
details.convg > summary h3{margin:0;font-size:14.5px;display:flex;align-items:center;gap:7px}
details.convg > summary h3::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
details.convg[open] > summary h3::before{transform:rotate(45deg)}
details.convg .table-wrap{border:0;border-top:1px solid var(--line);border-radius:0 0 10px 10px}
.toast .undo{margin-left:auto;background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:4px 10px;font-weight:650;cursor:pointer}
.toast .undo:hover{background:rgba(255,255,255,.12)}
.sug{font-size:12px;color:var(--primary-2)}
#lockscr{position:fixed;inset:0;z-index:55;display:grid;place-items:center;padding:20px;background:radial-gradient(1000px 500px at 10% -10%,var(--mint),transparent 60%),var(--bg)}
body.locked2 .shell,body.locked2 .bnav,body.locked2 #modal-root,body.locked2 #toasts{visibility:hidden}
/* Tela de login */
#login{position:fixed;inset:0;z-index:50;background:radial-gradient(1200px 600px at 10% -10%,var(--mint),transparent 60%),radial-gradient(900px 500px at 110% 110%,var(--primary-soft),transparent 60%),var(--bg);display:grid;place-items:center;padding:20px;overflow-y:auto}
.login-card{width:100%;max-width:390px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px 26px;box-shadow:var(--sh-3);display:grid;gap:4px;text-align:center}
.login-logo{width:76px;height:76px;margin:0 auto 8px}
.login-card h1{font-size:25px}
.login-sub{margin:0 0 18px;font:700 10.5px/1 var(--f-body);letter-spacing:.34em;color:var(--primary)}
#form-login,#form-lock{display:grid;gap:12px;text-align:left}
body.locked .shell,body.locked .bnav{display:none}

/* ===== Responsivo ===== */
@media (max-width:1180px){.kgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.dgrid{display:flex;flex-direction:column;align-items:stretch}.dcol{display:contents}}

  .nav a,.side-f button{justify-content:center;padding:11px 0}

  .nav .badge{position:absolute;top:3px;right:6px;min-width:17px;height:17px;line-height:17px;font-size:10px;padding:0 4px}
  .who{justify-content:center;padding:8px 0}
}
@media (max-width:900px){.week{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
/* Celular: barra inferior + janelas que sobem de baixo */
@media (max-width:767px){

  .top-in{padding:10px 14px;gap:8px}
  .mlogo{display:block;width:34px;height:34px;flex:none}

  .tbtn.mob{display:grid}
  .tbtn{width:38px;height:38px}
  .top .btn.primary{display:none}

  #banner{padding:0 14px}

  .bnav a,.bnav button{display:grid;justify-items:center;gap:3px;padding:5px 0;border:0;background:none;color:var(--muted);font:600 10.5px/1.1 var(--f-body);text-decoration:none;position:relative;cursor:pointer}
  .bnav .ic{width:22px;height:22px}
  .bnav a[aria-current="page"]{color:var(--primary-2)}
  .bnav a[aria-current="page"] .ic{color:var(--primary);--duo:.3}
  .bnav .fab{align-self:center}
  .bnav .fab span{width:48px;height:48px;border-radius:15px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 6px 16px -4px var(--ring);margin-top:-14px}
  .bnav .fab .ic{width:24px;height:24px}
  .bnav .badge{position:absolute;top:0;left:calc(50% + 6px);min-width:16px;height:16px;line-height:16px;font-size:9.5px;padding:0 4px}
  #toasts{bottom:calc(86px + env(safe-area-inset-bottom))}
  .backdrop{align-items:flex-end;padding:0;overflow:hidden}
  .modal,.modal.wide{max-width:none;border-radius:20px 20px 0 0;max-height:94dvh;overflow-y:auto;border:0;overscroll-behavior:contain}
  .modal::before{content:"";display:block;width:38px;height:4px;border-radius:9px;background:var(--line);margin:8px auto 0}

  .fields,.aval,.keys{grid-template-columns:1fr}

  .panel{padding:15px 14px}
  .slot{grid-template-columns:54px 1fr}
  .slot .hr{font-size:12.5px;padding-left:12px}
  .ses{min-width:0}
  .agbar input[type=date]{flex:1;min-width:0}
  .agbar .grow{display:none}
  .dash-h h2{font-size:19px}
  .kpi .xs{display:none}.dash-h .lbl{display:none}.dash-h .actions{flex-wrap:nowrap}
  .mswitch b{min-width:110px}
  .td{grid-template-columns:auto minmax(0,1fr)}.td .ta{grid-column:2}
  .qa small{display:none}
  .pal{border-radius:20px 20px 0 0}
  .t-hide{display:none}
}
@media (max-width:420px){.tr2{grid-template-columns:46px minmax(0,1fr)}.tr2 .ta{grid-column:2}}
@media (prefers-reduced-motion:no-preference){
  .modal{animation:pop .16s ease-out}
  @keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
  @media (max-width:767px){.modal{animation:up .2s ease-out}@keyframes up{from{transform:translateY(40px)}to{transform:none}}}

.chk.nf{align-items:flex-start;gap:10px}.chk.nf input{margin-top:3px}.chk.nf span{display:grid;gap:2px}.chk.nf small{color:var(--muted);font-size:12.5px}.chk.nf select{padding:2px 6px;font-size:12.5px}
@media (max-width:1180px){.rgrid{grid-template-columns:minmax(0,1fr)}}

const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dOf=iso=>{const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d);};
const addD=(iso,n)=>{const d=dOf(iso);d.setDate(d.getDate()+n);return isoOf(d);};

const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

const fmtDL=iso=>DOWL[wd(iso)]+', '+(+iso.slice(8,10))+' de '+MES[+iso.slice(5,7)-1];

const money=v=>BRL.format(Number(v)||0);
const r2=n=>Math.round(n*100)/100;
const toMin=h=>{const[a,b]=String(h||'0:0').split(':').map(Number);return(a||0)*60+(b||0);};
const fromMin=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const initials=n=>String(n||'?').trim().split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
function* months(a,b){let y=+a.slice(0,4),m=+a.slice(5,7);const by=+b.slice(0,4),bm=+b.slice(5,7);let g=0;while((y<by||(y===by&&m<=bm))&&g++<240){yield y+'-'+pad(m);m++;if(m>12){m=1;y++;}}}
function idade(n){if(!n)return'';const t=new Date(),d=dOf(n);let a=t.getFullYear()-d.getFullYear();if(t.getMonth()<d.getMonth()||(t.getMonth()===d.getMonth()&&t.getDate()<d.getDate()))a--;return a>=0&&a<130?a+' anos':'';}
function phoneDigits(p){let d=String(p||'').replace(/\D/g,'');if(!d)return'';if(d.startsWith('0'))d=d.replace(/^0+/,'');if(d.length<=11)d='55'+d;return d;}
function waLink(p,msg){const d=phoneDigits(p);return d?'https://wa.me/'+d+(msg?'?text='+encodeURIComponent(msg):''):'';}
function extenso(v){
  const u=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const d=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const c=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const ate999=n=>{if(!n)return'';if(n===100)return'cem';const p=[];const h=Math.floor(n/100),r=n%100;if(h)p.push(c[h]);if(r){if(r<20)p.push(u[r]);else{const t=Math.floor(r/10),o=r%10;p.push(o?d[t]+' e '+u[o]:d[t]);}}return p.join(' e ');};
  const reais=Math.floor(v+1e-9),cent=Math.round((v-reais)*100);const parts=[];
  if(reais){const mil=Math.floor(reais/1000),r=reais%1000;let s='';if(mil)s=mil===1?'mil':ate999(mil)+' mil';if(r)s+=(mil?((r<100||r%100===0)?' e ':' '):'')+ate999(r);parts.push(s+(reais===1?' real':' reais'));}
  if(cent)parts.push(ate999(cent)+(cent===1?' centavo':' centavos'));
  return parts.join(' e ')||'zero real';
}

function derive(){
  if(D)return D;
  const paid=new Map(),convPaid=new Set();
  for(const r of S.rec){
    if(r.referencia==='convenio'){(r.sessoes||[]).forEach(id=>convPaid.add(id));continue;}
    if(Array.isArray(r.itens)&&r.itens.length){for(const it of r.itens){const k='sessao:'+it.refId+':';paid.set(k,(paid.get(k)||0)+(+it.valor||0));}continue;}
    const k=r.referencia+':'+(r.refId||'')+':'+(r.competencia||'');paid.set(k,(paid.get(k)||0)+(+r.valor||0));
  }
  const uso=new Map();
  for(const s of S.ses){if(!s.pacoteId)continue;const p=S.pct.get(s.pacoteId);if(!p)continue;if(s.status==='realizado'||(s.status==='falta'&&p.faltaConsome))uso.set(s.pacoteId,(uso.get(s.pacoteId)||0)+1);}
  const t=today(),curM=ym(t);const prazo=Math.max(0,Math.round(+CFG().prazoPagamento||0));const pend=[],semPac=[],conv=[];
  for(const s of S.ses){
    if(s.cobranca==='avulsa'&&s.status==='realizado'&&+s.valor>0){const pg=paid.get('sessao:'+s.id+':')||0;const ab=r2(+s.valor-pg);if(ab>0.004){const venc=addD(s.data,prazo);pend.push({key:'s:'+s.id,tipo:'sessao',pacienteId:s.pacienteId,venc,desc:'Sessão de '+fmtD(s.data),valor:+s.valor,pago:pg,aberto:ab,ref:'sessao',refId:s.id,comp:'',vencido:venc<t});}}
    if(s.cobranca==='pacote'&&!s.pacoteId&&s.status==='realizado')semPac.push(s);
    if(s.cobranca==='convenio'&&s.status==='realizado'&&!convPaid.has(s.id))conv.push(s);
  }
  for(const[id,p]of S.pct){const pg=paid.get('pacote:'+id+':')||0;const ab=r2(+p.valor-pg);if(ab>0.004)pend.push({key:'p:'+id,tipo:'pacote',pacienteId:p.pacienteId,venc:p.dataCompra||t,desc:'Pacote de '+p.qtd+' sessões',valor:+p.valor,pago:pg,aberto:ab,ref:'pacote',refId:id,comp:'',vencido:(p.dataCompra||t)<t});}
  for(const[id,pl]of S.pla){
    if(!pl.inicio)continue;const end=pl.ativo===false&&pl.fim?(pl.fim<curM?pl.fim:curM):curM;
    for(const k of months(pl.inicio,end)){const venc=k+'-'+pad(Math.min(+pl.dia||10,dim(k)));const pg=paid.get('mensalidade:'+id+':'+k)||0;const ab=r2(+pl.valor-pg);if(ab>0.004)pend.push({key:'m:'+id+':'+k,tipo:'mensalidade',pacienteId:pl.pacienteId,venc,desc:'Mensalidade '+fmtYM(k),valor:+pl.valor,pago:pg,aberto:ab,ref:'mensalidade',refId:id,comp:k,vencido:venc<t});}
  }
  pend.sort((a,b)=>a.venc<b.venc?-1:a.venc>b.venc?1:0);
  return D={paid,convPaid,uso,pend,semPac,conv};
}
const saldoPacote=id=>{const p=S.pct.get(id);return p?(+p.qtd||0)-(derive().uso.get(id)||0):0;};
function pacotesDe(pid){return[...S.pct.entries()].map(([id,p])=>({id,...p})).filter(p=>p.pacienteId===pid).sort((a,b)=>String(a.dataCompra).localeCompare(String(b.dataCompra)));}
function pickPacote(pid,isFalta){const t=today();return pacotesDe(pid).find(p=>saldoPacote(p.id)>0&&(!p.validade||p.validade>=t)&&(!isFalta||p.faltaConsome))||null;}
function planoAtivo(pid){for(const[id,p]of S.pla)if(p.pacienteId===pid&&p.ativo!==false)return{id,...p};return null;}
const pendDe=pid=>derive().pend.filter(p=>p.pacienteId===pid);
function proxSessao(pid){const t=today();return S.ses.find(s=>s.pacienteId===pid&&ACTIVE(s)&&s.status!=='realizado'&&s.status!=='falta'&&s.data>=t)||null;}

function monthStats(k,ateDia){
  const lim=ateDia?k+'-'+pad(Math.min(ateDia,dim(k))):k+'-31';
  const inM=x=>x&&x.slice(0,7)===k&&x<=lim;

let tipEl=null;
function showTip(g){const ch=g.closest('.chart');if(!ch)return;const [a,b,c]=g.dataset.tip.split('|');if(!tipEl||!tipEl.isConnected){tipEl=document.createElement('div');tipEl.className='tip';}ch.appendChild(tipEl);
  tipEl.innerHTML=`<span>${a}</span><b class="money">${b}</b><span>${c}</span>`;const r=g.getBoundingClientRect(),cr=ch.getBoundingClientRect();const bar=g.querySelector('.bar')||g;const br=bar.getBoundingClientRect();
  let x=r.left-cr.left+r.width/2;x=Math.max(70,Math.min(cr.width-70,x));tipEl.style.left=x+'px';tipEl.style.top=(Math.min(br.top,r.bottom-30)-cr.top)+'px';tipEl.hidden=false;}

function runAction(ds){const b=document.createElement('button');b.hidden=true;for(const[k,v]of Object.entries(ds)){let x=v;if(x==='@hoje')x=today();else if(x==='@amanha')x=addD(today(),1);else if(x==='@mes')x=S.dmes;b.dataset[k]=x;}document.body.appendChild(b);b.click();b.remove();}
function palItems(q){
  const nq=norm(q.trim()),dg=q.replace(/\D/g,'');const items=[];
  const m=q.trim().match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
  if(m){const y=m[3]?(m[3].length===2?'20'+m[3]:m[3]):today().slice(0,4);const iso=y+'-'+pad(+m[2])+'-'+pad(+m[1]);if(!isNaN(dOf(iso))&&+m[2]<=12&&+m[1]<=31)items.push({g:'Agenda',l:'Abrir agenda em '+fmtDS(iso),i:'cal',ds:{action:'goto-day',d:iso}});}
  const pacs=pacList().filter(p=>!nq||norm(p.nome).includes(nq)||(dg.length>=3&&(String(p.telefone||'').replace(/\D/g,'').includes(dg)||String(p.cpf||'').replace(/\D/g,'').includes(dg)))||norm(p.convenio).includes(nq))
    .sort((a,b)=>(a.ativo===false)-(b.ativo===false)||(nq?norm(a.nome).indexOf(nq)-norm(b.nome).indexOf(nq):0));
  for(const p of pacs.slice(0,nq?7:4)){const nx=proxSessao(p.id);items.push({g:'Pacientes',l:p.nome,av:p.nome,sub:p.ativo===false?'inativo':nx?'próxima '+fmtDS(nx.data)+' '+nx.hora:p.telefone||'',ds:{action:'open-pac',id:p.id}});}
  for(const[l,i,k,ds,kw]of PAL_ACTS){if(nq&&!norm(l+' '+kw).includes(nq))continue;items.push({g:'Ações',l,i,k,ds});}
  return items;
}

/* ================= Pacientes ================= */
function filteredPac(){
  const q=norm(S.pq);const d=derive();
  const l=pacList().filter(p=>{
    const f=S.pst;
    if(f==='ativos'&&p.ativo===false)return false;
    if(f==='inativos'&&p.ativo!==false)return false;
    if(f==='pendencia'&&!d.pend.some(x=>x.pacienteId===p.id))return false;
    if(f==='pacote'&&!pacotesDe(p.id).some(x=>saldoPacote(x.id)>0))return false;
    if(f==='mensal'&&!planoAtivo(p.id))return false;
    if(f==='convenio'&&p.cobrancaPadrao!=='convenio')return false;
    if(f==='semagenda'&&(p.ativo===false||proxSessao(p.id)))return false;
    if(f==='aniver'&&(p.ativo===false||!p.nascimento||p.nascimento.slice(5,7)!==today().slice(5,7)))return false;
    if(q&&!norm([p.nome,p.telefone,p.convenio,p.bairro,p.email].join(' ')).includes(q)&&!String(p.telefone||'').replace(/\D/g,'').includes(q.replace(/\D/g,'')||'§'))return false;
    return true;
  });
  const pt=x=>{const n=proxSessao(x.id);return n?n.data+n.hora:'9';};
  if(S.psort==='proxima')l.sort((a,b)=>pt(a).localeCompare(pt(b)));
  else if(S.psort==='aberto'){const ab=new Map(l.map(x=>[x.id,pendDe(x.id).reduce((a,y)=>a+y.aberto,0)]));l.sort((a,b)=>ab.get(b.id)-ab.get(a.id));}
  else if(S.psort==='recentes')l.sort((a,b)=>String(b.criadoEm||'').localeCompare(String(a.criadoEm||'')));
  return l;
}

function relRanking(P){

function relOcupacao(P){

const NOTIF_OK='Notification' in window;
const lsG=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v;}catch(_){return d;}};
const lsS=(k,v)=>{try{localStorage.setItem(k,v);}catch(_){}};
const notifOn=()=>NOTIF_OK&&Notification.permission==='granted'&&lsG('tf-notif','0')==='1';
const notifMin=()=>+lsG('tf-notif-min','15')||15;
const notifOpt=k=>lsG('tf-notif-'+k,'1')==='1';
async function notify(title,body,tag,hash){
  const opt={body,tag,icon:'icons/icon-192.png',badge:'icons/icon-192.png',data:{url:'./'+(hash||'#inicio')}};
  try{if('serviceWorker' in navigator){const reg=await navigator.serviceWorker.getRegistration();if(reg&&reg.active&&reg.showNotification){await reg.showNotification(title,opt);return true;}}}catch(_){}
  try{const n=new Notification(title,opt);n.onclick=()=>{try{window.focus();}catch(_){}location.hash=(hash||'#inicio').replace('#','');n.close();};return true;}catch(_){return false;}
}
function notifReg(){const t=today();let o;try{o=JSON.parse(localStorage.getItem('tf-notif-env')||'{}');}catch(_){o={};}if(!o||o.d!==t||!Array.isArray(o.k))o={d:t,k:[]};return o;}
function notifTick(){
  if(!notifOn()||!allReady()||S.dbErr)return;
  const t=today(),nm=nowMin(),o=notifReg(),sent=new Set(o.k),out=[];const nome=id=>pacName(id).split(' ').slice(0,2).join(' ');
  const hoje=S.ses.filter(s=>s.data===t&&(s.status==='agendado'||s.status==='confirmado')).sort((a,b)=>String(a.hora).localeCompare(String(b.hora)));
  if(notifOpt('resumo')&&nm>=7*60&&nm<20*60&&!sent.has('resumo')){
    const tot=S.ses.filter(s=>s.data===t&&ACTIVE(s)&&s.status!=='falta').length;const pd=pendencias();const prox=hoje.find(s=>toMin(s.hora)>=nm);
    const b=[tot?(tot===1?'1 sessão':tot+' sessões')+(prox?' · próxima às '+prox.hora:''):'Nenhuma sessão agendada hoje'];
    if(pd.nFin)b.push(pd.nFin+' para finalizar');if(pd.nLem)b.push(pd.nLem+(pd.nLem===1?' lembrete':' lembretes')+' para amanhã');if(pd.nAtr)b.push(pd.nAtr+(pd.nAtr===1?' cobrança atrasada':' cobranças atrasadas'));
    out.push(['resumo',nm<12*60?'Bom dia! Seu dia no consultório':'Resumo do seu dia',b.join(' · '),'#inicio']);
  }
  if(notifOpt('antes')){const mn=notifMin();for(const s of hoje){const st=toMin(s.hora);if(nm>=st-mn&&nm<st&&!sent.has('a:'+s.id))out.push(['a:'+s.id,'Sessão às '+s.hora+' · em '+(st-nm)+' min',nome(s.pacienteId)+(s.local==='domicilio'?' · domicílio'+(s.endereco?': '+s.endereco:''):'')+(s.status==='confirmado'?' · confirmada':''),'#agenda']);}}
  if(notifOpt('fin')){for(const s of hoje){const fimS=toMin(s.hora)+(+s.duracao||50);if(nm>=fimS+5&&nm<=fimS+180&&!sent.has('f:'+s.id))out.push(['f:'+s.id,'Finalizar atendimento',nome(s.pacienteId)+' ('+s.hora+') · registre a evolução e os sinais vitais','#inicio']);}}
  if(!out.length)return;
  for(const x of out)o.k.push(x[0]);lsS('tf-notif-env',JSON.stringify(o));
  out.slice(0,4).forEach(([k,ti,b,h])=>notify(ti,b,'tf-'+k,h));
}

    :`<p class="muted" style="margin:0 0 12px">Receba avisos antes de cada sessão, um resumo do dia e um lembrete para finalizar o atendimento. Vale só para este aparelho: ative também no celular e no computador que você usar.</p><button class="btn primary" data-action="notif-on">${ic('bell')} Ativar notificações</button>`;

}

function toast(msg,kind,undo){const t=document.createElement('div');t.className='toast'+(kind==='err'?' err':'');t.innerHTML=ic(kind==='err'?'alert':'okcircle','lg');const sp=document.createElement('span');sp.textContent=msg;t.appendChild(sp);

function errMsg(code){
  if(code==='invalid_argument')return'Não foi possível salvar: seu usuário não tem permissão ou a sessão expirou. Saia e entre de novo.';
  if(code==='quota_exceeded')return'O limite de armazenamento foi atingido. Exporte e remova registros antigos.';
  if(code==='resource_exhausted')return'Muitas operações seguidas. Aguarde alguns segundos e tente de novo.';
  if(code==='revoked')return'Seu acesso a estes dados foi alterado.';
  return'Falha de conexão. Tente de novo em instantes.';
}
async function write(fn,quiet){
  try{await fn();return true;}
  catch(e){
    const code=e&&e.code;
    if(code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*900));try{await fn();return true;}catch(e2){if(!quiet)toast(errMsg(e2&&e2.code),'err');return false;}}
    if(code==='invalid_argument'){writable=false;renderBanner();renderBody();}
    if(!quiet)toast(errMsg(code),'err');return false;
  }
}

function applyPacCob(){const f=$('#form-pac');if(!f)return;const c=f.cobrancaPadrao.value;f.querySelectorAll('[data-c]').forEach(el=>el.hidden=el.dataset.c!==c&&!(el.dataset.c==='avulsa'&&c!=='convenio'));}
async function submitPac(f){
  const err=t=>{$('#pac-err').textContent=t;};const id=f.dataset.id||null;
  const nome=f.nome.value.trim().replace(/\s+/g,' ');if(nome.length<3)return err('Informe o nome completo do paciente.');
  const tel=f.telefone.value.trim();if(tel.replace(/\D/g,'').length<10)return err('Informe o telefone com DDD.');
  const cpf=f.cpf.value.replace(/\D/g,'');if(cpf&&cpf.length!==11)return err('O CPF deve ter 11 dígitos.');
  const num=x=>x.value===''?null:r2(x.valueAsNumber);
  const data={nome,telefone:tel,nascimento:f.nascimento.value,cpf:cpf?cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4'):'',email:f.email.value.trim(),endereco:f.endereco.value.trim(),queixa:f.queixa.value.trim(),
    cobrancaPadrao:f.cobrancaPadrao.value,valorSessao:num(f.valorSessao),convenio:f.convenio.value.trim(),carteirinha:f.carteirinha.value.trim(),valorConvenio:num(f.valorConvenio),obs:f.obs.value.trim(),atualizadoEm:new Date().toISOString()};
  if(data.cobrancaPadrao==='convenio'&&!data.convenio)return err('Informe o nome do convênio.');
  if(!id&&f.dataset.force!=='1'){const td=tel.replace(/\D/g,'');const dup=pacList().find(x=>norm(x.nome)===norm(nome)||(td.length>=10&&String(x.telefone||'').replace(/\D/g,'').slice(-9)===td.slice(-9)));
    if(dup){f.dataset.force='1';return err('Já existe '+dup.nome+(dup.telefone?' ('+dup.telefone+')':'')+' cadastrado. Confira se não é a mesma pessoa. Para salvar mesmo assim, toque em Salvar de novo.');}}
  {const rv=lerVitais(f,'av_');if(rv.erro){pacTab(f,'aval');return err('Avaliação: '+rv.erro);}
   const av={sinais:rv.v};for(const[k,,,t]of AVAL){if(t==='vit')continue;const el=f.elements['av_'+k];if(!el)continue;const x=el.value.trim();av[k]=t==='eva'?(x===''?null:Math.max(0,Math.min(10,Math.round(+x)))):x;}
   if(avalTemDados(av)){if(!av.dataAvaliacao)av.dataAvaliacao=today();data.avaliacao=av;}else if(id&&S.pac.get(id)&&S.pac.get(id).avaliacao)data.avaliacao=av;}
  const btn=f.querySelector('[type=submit]');btn.disabled=true;
  const ok=id?await write(()=>col('pacientes').doc(id).update(data)):await write(()=>col('pacientes').add({...data,ativo:true,...stamp()}));
  btn.disabled=false;if(ok){closeModal();toast(id?'Cadastro atualizado.':'Paciente cadastrado.');}
}

function formaPref(pid){const r=S.rec.filter(x=>x.pacienteId===pid&&FORMAS.includes(x.forma)).sort((a,b)=>String(b.data).localeCompare(String(a.data)))[0];return r?r.forma:FORMAS[0];}
function refOptions(pid,sel){const l=pid?pendDe(pid):[];return l.map(x=>`<option value="${esc(x.key)}" ${x.key===sel?'selected':''}>${esc(x.desc)} · ${money(x.aberto)} em aberto</option>`).join('')+`<option value="outro" ${!l.length||sel==='outro'?'selected':''}>Outro (avaliação, atendimento avulso etc.)</option>`;}
function applyRec(){const f=$('#form-rec');if(!f)return;f.querySelectorAll('[data-show="outro"]').forEach(el=>el.hidden=f.ref.value!=='outro');
  f.querySelectorAll('[data-show="qtd"]').forEach(el=>el.hidden=!(f.ref.value==='outro'||f.ref.value.startsWith('s:')));}
/* Quantidade de sessões: quita várias sessões em aberto de uma vez, ou calcula um pagamento adiantado */
function recPlano(f){
  const pid=f.paciente.value,ref=f.ref.value,n=Math.max(1,Math.min(60,Math.round(+f.qtd.value||1)));
  if(ref.startsWith('s:')){const ab=pendDe(pid).filter(x=>x.tipo==='sessao');const i0=ab.findIndex(x=>x.key===ref);if(i0<0)return null;
    const ord=[ab[i0],...ab.filter((x,i)=>i!==i0)];const itens=ord.slice(0,n);return{modo:'sessoes',n:itens.length,pedido:n,max:ab.length,itens,total:r2(itens.reduce((a,x)=>a+x.aberto,0))};}
  if(ref==='outro'){const p=S.pac.get(pid)||{};const unit=p.valorSessao!=null&&p.valorSessao!==''?+p.valorSessao:+CFG().valorPadrao||0;return{modo:'outro',n,unit,total:r2(n*unit)};}
  return null;}
const datasCurtas=ds=>{const a=ds.slice().sort();const f=a.map(d=>d.slice(8,10)+'/'+d.slice(5,7));return f.length>1?f.slice(0,-1).join(', ')+' e '+f[f.length-1]:f[0]||'';};
function recQtd(f,setValor){if(!f||!f.qtd)return;const pl=recPlano(f);const info=$('#r-qtd-info');if(!pl){if(info)info.textContent='';return;}
  if(pl.modo==='sessoes'){if(+f.qtd.value>pl.max)f.qtd.value=pl.max;
    info.textContent=(pl.n===1?'Quita a sessão de ':'Quita as '+pl.n+' sessões de ')+datasCurtas(pl.itens.map(x=>S.ses.find(s=>s.id===x.refId)?.data||x.venc))+(pl.max>1?' · '+pl.max+' em aberto':'')+'.';}
  else{info.textContent=pl.n+' × '+money(pl.unit)+' = '+money(pl.total)+' (pagamento adiantado ou sem sessão em aberto).';
    const ds=f.desc.value.trim();if(!ds||/^\d+ sess(ão|ões) de fisioterapia$/.test(ds))f.desc.value=pl.n+(pl.n===1?' sessão':' sessões')+' de fisioterapia';}
  if(setValor)f.valor.value=pl.total;}
async function submitRec(f){
  const err=t=>{$('#rec-err').textContent=t;};
  const pid=f.paciente.value;if(!S.pac.get(pid))return err('Escolha o paciente.');
  const valor=r2(f.valor.valueAsNumber);if(!(valor>0))return err('Informe o valor recebido.');
  const data=f.data.value;if(!data)return err('Informe a data.');if(data>today())return err('A data não pode ser futura.');
  let doc={pacienteId:pid,data,valor,forma:f.forma.value,obs:f.obs.value.trim(),...stamp()};
  if(f.ref.value==='outro'){const ds=f.desc.value.trim();if(!ds)return err('Descreva a que se refere o pagamento.');Object.assign(doc,{referencia:'outro',refId:'',competencia:'',desc:ds});}
  else if(f.ref.value.startsWith('s:')){const pl=recPlano(f);if(!pl||!pl.itens.length)return err('Esta cobrança já foi quitada. Atualize a tela.');
    if(valor>pl.total+0.004&&f.dataset.force!=='1'){f.dataset.force='1';return err(`O valor é maior que o total em aberto dessas sessões (${money(pl.total)}). Clique de novo para registrar assim mesmo.`);}
    let resto=valor;const itens=pl.itens.map((x,i)=>{const v=i===pl.itens.length-1?r2(resto):r2(Math.min(resto,x.aberto));resto=r2(resto-v);return{refId:x.refId,valor:v};}).filter(x=>x.valor>0);
    const datas=pl.itens.map(x=>(S.ses.find(s=>s.id===x.refId)||{}).data||x.venc);
    Object.assign(doc,{referencia:'sessao',refId:pl.itens[0].refId,competencia:'',qtd:pl.n,itens,sessoesDatas:datas.slice().sort(),desc:pl.n===1?pl.itens[0].desc:pl.n+' sessões de fisioterapia ('+datasCurtas(datas)+')'});}
  else{const pe=derive().pend.find(x=>x.key===f.ref.value);if(!pe)return err('Esta cobrança já foi quitada. Atualize a tela.');
    if(valor>pe.aberto+0.004&&f.dataset.force!=='1'){f.dataset.force='1';return err(`O valor é maior que o saldo em aberto (${money(pe.aberto)}). Clique de novo para registrar assim mesmo.`);}
    Object.assign(doc,{referencia:pe.ref,refId:pe.refId,competencia:pe.comp,desc:pe.desc});}
  if(f.ref.value==='outro'){const n=Math.round(+f.qtd.value||0);if(n>0)doc.qtd=n;}
  const btn=f.querySelector('[type=submit]');btn.disabled=true;let novo=null;
  const ok=await write(async()=>{novo=await col('recebimentos').add(doc);});btn.disabled=false;
  if(ok){const quer=f.recibo&&f.recibo.checked;closeModal();toast(money(valor)+' recebido de '+pacName(pid).split(' ')[0]+'.');if(quer&&novo)reciboModal({id:novo.id,...doc});}
}

  if(t.id==='lg-cpf'){const d=t.value.replace(/\D/g,'').slice(0,11);t.value=d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/(\d{3})\.(\d{3})\.(\d{3})(\d)/,'$1.$2.$3-$4');}
  if(t.id==='p-q'){S.pq=t.value;renderBody();}
  else if(t.id==='pal-q'){S.palSel=0;renderPal();}
  else if(t.id==='f-q'){S.fq=t.value;S.flim=30;const r=$('#cob-rows');if(r)r.innerHTML=cobRows();}
  else if(t.id==='lem-msg')updLemLink();
  else if(t.id==='r-qtd'){recQtd(t.form,true);}
  else if(t.id==='s-busca'){const f=$('#form-ses');if(f)f.paciente.value='';renderCombo();applySes();}
  else if(t.form&&t.form.id==='form-pac'&&t.name==='telefone'){const d=t.value.replace(/\D/g,'').slice(0,11);t.value=d.length>10?d.replace(/(\d{2})(\d{5})(\d{0,4})/,'($1) $2-$3'):d.length>6?d.replace(/(\d{2})(\d{4})(\d{0,4})/,'($1) $2-$3'):d.length>2?d.replace(/(\d{2})(\d+)/,'($1) $2'):d;}
  else if(t.form&&t.form.id==='form-pac'&&t.name==='cpf'){const d=t.value.replace(/\D/g,'').slice(0,11);t.value=d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/(\d{3})\.(\d{3})\.(\d{3})(\d)/,'$1.$2.$3-$4');}
  else if(t.form&&t.form.id==='form-pac'&&(t.name==='nome'||t.name==='telefone'))delete t.form.dataset.force;
});
function onSesPac(f){const p=S.pac.get(f.paciente.value);if(!p)return;const cb=p.cobrancaPadrao||'avulsa';const r=f.querySelector(`input[name=cobranca][value="${cb}"]`);if(r)r.checked=true;f.valor.value=defaultValor(p,cb)??'';if(!f.endereco.value)f.endereco.value=p.endereco||'';}
document.addEventListener('change',e=>{
  const t=e.target;const f=t.form;
  if(t.id==='lg-ver'){$('#lg-senha').type=t.checked?'text':'password';return;}
  if(t.id==='up-oficial'&&t.files&&t.files[0]){const file=t.files[0];if(file.size>150*1024){toast('Arquivo maior que 150 KB. Reduza o tamanho e envie de novo.','err');return;}
    const rd=new FileReader();rd.onload=async()=>{const url=String(rd.result||'');if(!/^data:image\//.test(url)){toast('Envie uma imagem PNG, SVG, JPG ou WEBP.','err');return;}if(await write(()=>db.doc('config/geral').set({...S.cfg,simboloOficial:url}))){toast('Símbolo oficial enviado.');setTimeout(renderBody,300);}};rd.readAsDataURL(file);return;}
  if(t.id==='ag-date'&&t.value){S.day=t.value;renderTab();}
  else if(t.id==='ag-canc'){S.showCanc=t.checked;renderBody();}
  else if(t.id==='p-st'){S.pst=t.value;renderBody();}
  else if(t.id==='p-sort'){S.psort=t.value;renderBody();}
  else if(t.id==='cfg-lock'){try{localStorage.setItem('tf-lock-min',t.value);}catch(_){}marcaAtividade(true);toast(+t.value?'O app vai bloquear após '+t.options[t.selectedIndex].text+' parado.':'Bloqueio automático desligado.');}
  else if(t.id==='f-mes'&&t.value){S.fmes=t.value;renderBody();}
  else if(t.id==='r-per'){if(t.value==='custom'&&S.rp!=='custom'){const P=relPeriodo();S.rIni=P.ini;S.rFim=P.fim>today()?today():P.fim;}S.rp=t.value;S.rall=false;renderTab();}
  else if((t.id==='r-ini'||t.id==='r-fim')&&t.value){S[t.id==='r-ini'?'rIni':'rFim']=t.value;renderBody();updateChrome();}
  else if(t.id==='r-sort'){S.rsort=t.value;renderBody();}
  else if(t.id==='nf-min'){lsS('tf-notif-min',t.value);}
  else if(t.id==='nf-antes'||t.id==='nf-resumo'||t.id==='nf-fin'){lsS('tf-notif-'+t.id.slice(3),t.checked?'1':'0');}
  else if(f&&f.id==='form-pac'&&t.name==='cobrancaPadrao')applyPacCob();
  else if(f&&f.id==='form-ses'){if(t.id==='s-pac')onSesPac(f);if(t.name==='cobranca'){const p=S.pac.get(f.paciente.value);f.valor.value=defaultValor(p,t.value)??'';}if(t.name==='local'&&t.value==='domicilio'&&!f.endereco.value){const p=S.pac.get(f.paciente.value);if(p)f.endereco.value=p.endereco||'';}if(t.name==='hora'){delete f.dataset.autoHora;const sg=$('#s-sug');if(sg)sg.textContent='';}if((t.name==='data'||t.name==='duracao')&&f.dataset.autoHora==='1')sugHora(f);if(t.name==='data'&&f.repetir){const d=wd(t.value);f.querySelectorAll('input[name=dias]').forEach(x=>{if(+x.value===d)x.checked=true;});}delete f.dataset.force;applySes();}
  else if(f&&f.id==='form-pct'&&t.name==='pagoAgora')applyPct();
  else if(f&&f.id==='form-rec'&&(t.id==='r-pac'||t.id==='r-ref')){f.qtd.value=1;}
  if(f&&f.id==='form-rec'){if(t.id==='r-pac'){f.ref.innerHTML=refOptions(t.value,'');const fr=f.querySelector(`input[name=forma][value="${formaPref(t.value)}"]`);if(fr)fr.checked=true;}const pe=derive().pend.find(x=>x.key===f.ref.value);if(pe&&(t.id==='r-ref'||t.id==='r-pac'))f.valor.value=pe.aberto;delete f.dataset.force;applyRec();if(t.id==='r-pac'||t.id==='r-ref'||t.id==='r-qtd')recQtd(f,t.id==='r-qtd'||f.ref.value==='outro');}
});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='form-ses')submitSes(f);else if(f.id==='form-pac')submitPac(f);else if(f.id==='form-pct')submitPct(f);
  else if(f.id==='form-pla')submitPla(f);else if(f.id==='form-rec')submitRec(f);else if(f.id==='form-conv')submitConv(f);else if(f.id==='form-fin')submitFin(f);
  else if(f.id==='form-senha'){
    const e1=$('#senha-err');const a1=f.s1.value,a2=f.s2.value;
    if(a1.length<8){e1.textContent='A senha deve ter pelo menos 8 caracteres.';return;}
    if(a1!==a2){e1.textContent='As duas senhas não conferem.';return;}
    try{await Dados.novaSenha(a1);e1.textContent='';f.reset();toast('Senha alterada.');}catch(err){e1.textContent='Não foi possível trocar a senha: '+(err&&err.message||'tente de novo.');}
  }
  else if(f.id==='form-lock')desbloquear(f);
  else if(f.id==='form-login'){
    const e1=$('#login-err');const cpf=f.cpf.value.replace(/\D/g,'');
    if(!cpfValido(cpf)){e1.textContent='Confira o CPF: ele deve ter 11 números válidos.';return;}
    if(!f.senha.value){e1.textContent='Digite a senha.';return;}
    const btn=f.querySelector('[type=submit]');btn.disabled=true;btn.textContent='Entrando…';
    try{const ses=await Dados.entrar(cpf,f.senha.value);e1.textContent='';try{localStorage.removeItem('tf-locked');localStorage.setItem('tf-last',String(Date.now()));}catch(_){}await iniciar(ses);}
    catch(err){e1.textContent=/Invalid login/i.test(err&&err.message||'')?'CPF ou senha incorretos.':'Não foi possível entrar agora. Verifique a internet e tente de novo.';}
    btn.disabled=false;btn.textContent='Entrar';
  }
  else if(f.id==='form-cfg'){
    const g=n=>f.elements[n];const vp=g('valorPadrao').valueAsNumber,dp=g('duracaoPadrao').valueAsNumber;
    if(toMin(g('fimDia').value)<=toMin(g('inicioDia').value)){$('#cfg-err').textContent='O fim do expediente deve ser depois do início.';return;}
    const data={nomeProfissional:g('nomeProfissional').value.trim(),crefito:g('crefito').value.trim(),documento:g('documento').value.trim(),telefone:g('telefone').value.trim(),endereco:g('endereco').value.trim(),cidade:g('cidade').value.trim(),pix:g('pix').value.trim(),
      valorPadrao:vp>=0?r2(vp):120,duracaoPadrao:dp>=10?Math.round(dp):50,inicioDia:g('inicioDia').value||'07:00',fimDia:g('fimDia').value||'19:00',prazoPagamento:Math.max(0,Math.min(365,Math.round(Number.isFinite(g('prazoPagamento').valueAsNumber)?g('prazoPagamento').valueAsNumber:90))),msgWhats:g('msgWhats').value.trim()||DEFAULT_MSG,simboloOficial:S.cfg.simboloOficial||''};
    const btn=f.querySelector('[type=submit]');btn.disabled=true;const ok=await write(()=>db.doc('config/geral').set(data));btn.disabled=false;if(ok){$('#cfg-err').textContent='';toast('Ajustes salvos.');}
  }
});
window.addEventListener('hashchange',route);

/* ================= Dados ================= */
let refreshQ=0;
function refresh(){D=null;if(refreshQ)return;refreshQ=requestAnimationFrame(()=>{refreshQ=0;doRefresh();});}
function doRefresh(){
  D=null;renderBanner();
  if(S.tab!=='ajustes'||!$('#form-cfg'))renderBody();
  if(S.open&&$('#drawer')){if(S.open.t==='pac')pacDrawer(S.open.id);else sesDrawer(S.open.id);}
}
function checkLive(){if(Object.keys(COLLS).every(k=>S.live[k])&&S.live.cfg){clearTimeout(loadTimer);S.timedOut=false;}}
function cpfValido(c){c=String(c||'').replace(/\D/g,'');if(c.length!==11||/^(\d)\1{10}$/.test(c))return false;let t=0;for(let i=0;i<9;i++)t+=+c[i]*(10-i);let d=(t*10)%11%10;if(d!==+c[9])return false;t=0;for(let i=0;i<10;i++)t+=+c[i]*(11-i);d=(t*10)%11%10;return d===+c[10];}
/* ===== Bloqueio por inatividade ===== */
function lockMin(){try{const v=localStorage.getItem('tf-lock-min');return v==null?30:Math.max(0,+v||0);}catch(_){return 30;}}
let ultAtiv=0;
function marcaAtividade(force){const n=Date.now();if(!force&&n-ultAtiv<15000)return;ultAtiv=n;try{localStorage.setItem('tf-last',String(n));}catch(_){}}
function checaBloqueio(){if(!window.__sessao||document.body.classList.contains('locked2')||document.body.classList.contains('locked'))return;const m=lockMin();if(!m)return;
  let last=ultAtiv;try{last=Math.max(last,+localStorage.getItem('tf-last')||0);}catch(_){}if(last&&Date.now()-last>m*60000)bloquear();}
function bloquear(){if(document.body.classList.contains('locked2'))return;try{localStorage.setItem('tf-locked','1');}catch(_){}document.body.classList.add('locked2');if(tipEl)tipEl.hidden=true;
  const d=document.createElement('section');d.id='lockscr';d.innerHTML=`<div class="login-card"><svg class="login-logo" viewBox="0 0 64 64" aria-hidden="true"><use href="#logo-emblem"/></svg><h1>App bloqueado</h1><p class="login-sub">PROTEÇÃO DOS DADOS</p>
  <form id="form-lock" novalidate><p class="muted" style="margin:0;font-size:14px;text-align:center">Ficou parado por um tempo. Digite a senha para continuar de onde parou.</p><label class="field"><span>CPF</span><input value="${esc(contaCPF())}" disabled></label><label class="field"><span>Senha</span><input id="lk-senha" type="password" autocomplete="current-password"></label><div class="formerr" id="lock-err"></div><button type="submit" class="btn primary" style="width:100%;min-height:46px">${ic('lock')} Desbloquear</button><button type="button" class="linkbtn" data-action="lock-sair" style="justify-self:center;margin-top:4px">Entrar com outra conta</button></form></div>`;
  document.body.appendChild(d);setTimeout(()=>{const i=$('#lk-senha');if(i)i.focus();},50);}
async function desbloquear(f){const e1=$('#lock-err');const senha=$('#lk-senha').value;if(!senha){e1.textContent='Digite a senha.';return;}
  const cpf=String((window.__sessao&&window.__sessao.user&&window.__sessao.user.email)||'').split('@')[0].replace(/\D/g,'');
  const btn=f.querySelector('[type=submit]');btn.disabled=true;
  try{const ses=await Dados.entrar(cpf,senha);if(ses)window.__sessao=ses;try{localStorage.removeItem('tf-locked');}catch(_){}document.body.classList.remove('locked2');const d=$('#lockscr');if(d)d.remove();marcaAtividade(true);refresh();}
  catch(err){e1.textContent=/Invalid login/i.test(err&&err.message||'')?'Senha incorreta.':'Não foi possível conferir a senha agora. Verifique a internet.';btn.disabled=false;}}
['pointerdown','keydown','touchstart','wheel'].forEach(ev=>document.addEventListener(ev,()=>{if(!document.body.classList.contains('locked2'))marcaAtividade();},{passive:true,capture:true}));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checaBloqueio();});
setInterval(checaBloqueio,20000);
setInterval(notifTick,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(notifTick,1500);});
function mostrarLogin(){document.body.classList.add('locked');$('#login').hidden=false;setTimeout(()=>{const i=$('#lg-cpf');if(i)i.focus();},50);}
let iniciado=false;
async function iniciar(sessao){
  window.__sessao=sessao;document.body.classList.remove('locked');$('#login').hidden=true;
  {let fl=false,last=0;try{fl=localStorage.getItem('tf-locked')==='1';last=+localStorage.getItem('tf-last')||0;}catch(_){}const m=lockMin();
   if(m&&(fl||(last&&Date.now()-last>m*60000)))setTimeout(bloquear,0);else if(!fl)marcaAtividade(true);}
  if(iniciado){refresh();return;}iniciado=true;
  db=Dados.db;DL=DL_LOCAL;myId=sessao.user.id;applyDl();setTimeout(notifTick,5000);
  try{if(!(await Dados.souMembro())){writable=false;S.noAccess=true;}}catch(_){}
  loadTimer=setTimeout(()=>{S.timedOut=true;renderBanner();},12000);
  const onErr=e=>{clearTimeout(loadTimer);const perm=(e&&e.code)==='invalid_argument';S.dbErr=perm?null:'nodb';if(perm){S.noAccess=true;writable=false;}Object.keys(COLLS).forEach(k=>S.ready[k]=true);S.ready.cfg=true;refresh();};
  for(const[c,key]of Object.entries(COLLS)){
    db.collection(c).onSnapshot(snap=>{
      if(key==='ses')S.ses=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.data===b.data?String(a.hora).localeCompare(String(b.hora)):a.data<b.data?-1:1);
      else if(key==='rec')S.rec=snap.docs.map(d=>({id:d.id,...d.data()}));
      else S[key]=new Map(snap.docs.map(d=>[d.id,d.data()]));
      S.ready[c]=true;S.live[c]=true;checkLive();refresh();
    },onErr);
  }
  db.doc('config/geral').onSnapshot(snap=>{S.cfg=snap.exists?snap.data():{};S.ready.cfg=true;S.live.cfg=true;checkLive();refresh();},onErr);
  Dados.iniciarTempoReal();
}
async function boot(){
  themeLbl();try{if(sessionStorage.getItem('tf-priv'))setPriv(true);}catch(_){}
  window.addEventListener('scroll',()=>{const tp=$('.top');if(tp)tp.classList.toggle('scrolled',window.scrollY>4);},{passive:true});
  setInterval(()=>{if(allReady()&&!$('#modal-root').innerHTML&&(S.tab==='inicio'||S.tab==='agenda')&&!document.hidden)refresh();},5*60*1000);
  route();
  if(!window.Dados||!Dados.configurado){S.dbErr='config';Object.keys(COLLS).forEach(k=>S.ready[k]=true);S.ready.cfg=true;writable=false;refresh();return;}
  Dados.aoMudarLogin((ev,ses)=>{if(ev==='SIGNED_OUT'){window.__sessao=null;mostrarLogin();}else if(ses)window.__sessao=ses;});
  let ses=null;try{ses=await Dados.sessao();}catch(_){}
  if(ses)iniciar(ses);else mostrarLogin();
}
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
boot();
})();
</script>
